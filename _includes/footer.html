<div class="session-timer" id="session-timer">⏱ 0:00</div>

<style>
.session-timer {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background-color: rgba(255, 215, 0, 0.9);
  color: #1a1a1a;
  font-family: 'Inter', sans-serif;
  font-size: 0.78em;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 9999px;
  z-index: 9999;
  user-select: none;
  pointer-events: none;
}
</style>

<script>
(function() {
  var start = Date.now();
  var el = document.getElementById('session-timer');
  function update() {
    var s = Math.floor((Date.now() - start) / 1000);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    el.textContent = '⏱ ' + m + ':' + (sec < 10 ? '0' : '') + sec;
    requestAnimationFrame(update);
  }
  update();
})();
</script>
