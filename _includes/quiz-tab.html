<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" type="text/css">

<div class="quiz-wrapper">
  <!-- Start Screen -->
  <div id="quiz-start" class="quiz-start">
    <h2>🧠 Quiz</h2>
    <p>100 questions from Android, Kotlin, Compose, Coroutines, Architecture and more.<br>Pick a difficulty and challenge yourself.</p>

    <div class="quiz-diff-label">Select Difficulty</div>
    <div class="quiz-diff-options">
      <button class="quiz-diff-btn" data-diff="easy" onclick="quizSelectDiff('easy')">
        <span class="diff-icon">🟢</span> Easy
      </button>
      <button class="quiz-diff-btn" data-diff="medium" onclick="quizSelectDiff('medium')">
        <span class="diff-icon">🟡</span> Medium
      </button>
      <button class="quiz-diff-btn" data-diff="hard" onclick="quizSelectDiff('hard')">
        <span class="diff-icon">🔴</span> Hard
      </button>
      <button class="quiz-diff-btn" data-diff="all" onclick="quizSelectDiff('all')">
        <span class="diff-icon">🎯</span> All Levels
      </button>
    </div>

    <button class="quiz-go-btn" id="quiz-go-btn" onclick="quizStart()">Start Quiz →</button>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" class="quiz-hidden">
    <div class="quiz-progress">
      <div class="quiz-progress-header">
        <span id="quiz-counter">Question 1 of 100</span>
        <span id="quiz-score">Score: 0</span>
      </div>
      <div class="quiz-progress-bg">
        <div class="quiz-progress-fill" id="quiz-progress-fill" style="width:0%"></div>
      </div>
      <div class="quiz-score-chips">
        <span class="quiz-chip-correct">✓ <span id="quiz-correct">0</span></span>
        <span class="quiz-chip-wrong">✗ <span id="quiz-wrong">0</span></span>
      </div>
    </div>

    <div id="quiz-question-area"></div>

    <div class="quiz-actions">
      <button class="quiz-restart-mid" onclick="quizRestart()">↺ Restart</button>
      <button class="quiz-next-btn quiz-hidden" id="quiz-next-btn" onclick="quizNext()">Next →</button>
    </div>
  </div>

  <!-- Results Screen -->
  <div id="quiz-results" class="quiz-results quiz-hidden"></div>
</div>

<script>
(function() {
  var qzAll = [];
  var qzQuestions = [];
  var qzIdx = 0;
  var qzCorrect = 0;
  var qzWrong = 0;
  var qzDiff = null;
  var qzAnswered = false;
  var QUIZ_SIZE = 100;

  fetch('/static/quiz-questions.json')
    .then(function(r) { return r.json(); })
    .then(function(data) { qzAll = data; })
    .catch(function(e) { console.error('Failed to load questions:', e); });

  window.quizSelectDiff = function(diff) {
    qzDiff = diff;
    document.querySelectorAll('.quiz-diff-btn').forEach(function(b) { b.classList.remove('selected'); });
    document.querySelector('.quiz-diff-btn[data-diff="' + diff + '"]').classList.add('selected');
    document.getElementById('quiz-go-btn').classList.add('active');
  };

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = a[i]; a[i] = a[j]; a[j] = temp;
    }
    return a;
  }

  window.quizStart = function() {
    if (!qzDiff) return;
    var pool = qzAll;
    if (qzDiff !== 'all') {
      pool = qzAll.filter(function(q) { return q.difficulty === qzDiff; });
    }
    qzQuestions = shuffle(pool).slice(0, QUIZ_SIZE);
    var diffOrder = { easy: 0, medium: 1, hard: 2 };
    qzQuestions.sort(function(a, b) { return (diffOrder[a.difficulty] || 0) - (diffOrder[b.difficulty] || 0); });
    qzIdx = 0;
    qzCorrect = 0;
    qzWrong = 0;
    qzAnswered = false;
    document.getElementById('quiz-start').classList.add('quiz-hidden');
    document.getElementById('quiz-screen').classList.remove('quiz-hidden');
    document.getElementById('quiz-results').classList.add('quiz-hidden');
    renderQ();
  };

  function highlightCode(code) {
    var text = escHtml(code);
    // Kotlin/Java syntax highlighting
    var keywords = ['fun ', 'val ', 'var ', 'class ', 'object ', 'interface ', 'abstract ', 'override ', 'private ', 'public ', 'internal ', 'protected ', 'open ', 'sealed ', 'data ', 'enum ', 'companion ', 'suspend ', 'inline ', 'crossinline ', 'noinline ', 'reified ', 'return ', 'return\n', 'if ', 'if(', 'else ', 'else{', 'when ', 'when(', 'when {', 'for ', 'for(', 'while ', 'while(', 'do ', 'do{', 'try ', 'try{', 'catch ', 'catch(', 'finally ', 'finally{', 'throw ', 'import ', 'package ', 'is ', 'as ', 'in ', 'by ', 'lazy ', 'lateinit ', 'const ', 'true', 'false', 'null', 'this', 'super', 'it ', 'it.', 'it)', 'it,', 'it}', 'typealias ', 'init ', 'init{', 'constructor'];
    var types = ['Int', 'Long', 'Float', 'Double', 'Boolean', 'String', 'Unit', 'Any', 'Nothing', 'List', 'Map', 'Set', 'MutableList', 'MutableMap', 'MutableSet', 'Array', 'Pair', 'Triple', 'Sequence', 'Flow', 'StateFlow', 'SharedFlow', 'MutableStateFlow', 'MutableSharedFlow', 'Channel', 'Deferred', 'Job', 'SupervisorJob', 'CoroutineScope', 'CoroutineContext', 'Dispatchers', 'CoroutineExceptionHandler', 'Mutex', 'Semaphore', 'LiveData', 'MutableLiveData', 'ViewModel', 'AndroidViewModel', 'Composable', 'Modifier', 'State', 'MutableState', 'LaunchedEffect', 'DisposableEffect', 'SideEffect', 'remember', 'rememberSaveable', 'derivedStateOf', 'snapshotFlow', 'Context', 'Intent', 'Activity', 'Fragment', 'Service', 'BroadcastReceiver', 'ContentProvider', 'Application', 'Bundle', 'Parcelable', 'Serializable', 'View', 'ViewGroup', 'RecyclerView', 'Adapter', 'ViewHolder'];
    var annotations = ['@Composable', '@Inject', '@HiltViewModel', '@Module', '@InstallIn', '@Provides', '@Singleton', '@Binds', '@AndroidEntryPoint', '@Override', '@Test', '@Before', '@After', '@JvmStatic', '@JvmField', '@JvmOverloads', '@Volatile', '@Synchronized', '@Suppress'];

    // Comments
    text = text.replace(/(\/\/.*$)/gm, '<span class="cmt">$1</span>');
    // Annotations
    annotations.forEach(function(ann) {
      text = text.split(ann).join('<span class="ann">' + ann + '</span>');
    });
    // Strings
    text = text.replace(/(&quot;[^&]*?&quot;)/g, '<span class="str">$1</span>');
    text = text.replace(/("(?:[^"\\]|\\.)*?")/g, '<span class="str">$1</span>');
    // Numbers
    text = text.replace(/\b(\d+[Lf]?)\b/g, '<span class="num">$1</span>');
    // Types
    types.forEach(function(t) {
      var re = new RegExp('\\b(' + t + ')\\b', 'g');
      text = text.replace(re, '<span class="type">$1</span>');
    });
    // Keywords (word boundary safe)
    var kwList = ['fun', 'val', 'var', 'class', 'object', 'interface', 'abstract', 'override', 'private', 'public', 'internal', 'protected', 'open', 'sealed', 'data', 'enum', 'companion', 'suspend', 'inline', 'crossinline', 'noinline', 'reified', 'return', 'if', 'else', 'when', 'for', 'while', 'do', 'try', 'catch', 'finally', 'throw', 'import', 'package', 'is', 'as', 'in', 'by', 'lazy', 'lateinit', 'const', 'true', 'false', 'null', 'this', 'super', 'typealias', 'init', 'constructor', 'emit', 'collect', 'launch', 'async', 'await', 'withContext', 'coroutineScope', 'supervisorScope', 'runBlocking', 'delay'];
    kwList.forEach(function(kw) {
      var re = new RegExp('(?<![\\w.])(' + kw + ')(?=\\s|\\(|\\{|\\)|\\}|,|\\.|;|$|&lt;|&gt;|:)', 'gm');
      text = text.replace(re, '<span class="kw">$1</span>');
    });
    // Function calls
    text = text.replace(/(?<![.\w])(\w+)(?=\()/g, function(match, fn) {
      if (kwList.indexOf(fn) === -1) {
        return '<span class="fn">' + fn + '</span>';
      }
      return match;
    });
    return text;
  }

  function renderQ() {
    qzAnswered = false;
    var q = qzQuestions[qzIdx];
    var total = qzQuestions.length;
    document.getElementById('quiz-counter').textContent = 'Question ' + (qzIdx + 1) + ' of ' + total;
    document.getElementById('quiz-score').textContent = 'Score: ' + qzCorrect + '/' + qzIdx;
    document.getElementById('quiz-correct').textContent = qzCorrect;
    document.getElementById('quiz-wrong').textContent = qzWrong;
    document.getElementById('quiz-progress-fill').style.width = ((qzIdx / total) * 100) + '%';
    document.getElementById('quiz-next-btn').classList.add('quiz-hidden');

    var area = document.getElementById('quiz-question-area');
    var letters = ['A', 'B', 'C', 'D'];
    var typeLabel = q.type === 'mcq' ? 'Multiple Choice' : 'Flashcard';

    var questionText = q.q;
    var codeStr = q.code || null;

    // Extract embedded code blocks from question text
    var codeMatch = questionText.match(/```(\w*)\n([\s\S]*?)```/);
    if (codeMatch && !codeStr) {
      codeStr = codeMatch[2].trim();
      questionText = questionText.replace(/\n?```(\w*)\n[\s\S]*?```/, '').trim();
    }
    // Also strip backtick markers that might still be in question text
    questionText = questionText.replace(/```\w*/g, '').replace(/```/g, '').trim();

    var codeBlock = codeStr ? '<pre class="quiz-q-code">' + highlightCode(codeStr) + '</pre>' : '';

    var html = '<div class="quiz-card" id="quiz-card">' +
      '<div class="quiz-q-badges">' +
      '<span class="quiz-q-topic">' + q.topic + '</span>' +
      '<span class="quiz-q-diff ' + q.difficulty + '">' + q.difficulty + '</span>' +
      '<span class="quiz-q-type">' + typeLabel + '</span>' +
      '</div>' +
      '<div class="quiz-q-text">' + escHtml(questionText) + '</div>' +
      codeBlock;

    if (q.type === 'mcq') {
      html += '<div class="quiz-options">';
      for (var i = 0; i < q.options.length; i++) {
        html += '<button class="quiz-option" data-index="' + i + '" onclick="quizSelect(' + i + ')">' +
          '<span class="quiz-option-letter">' + letters[i] + '</span>' +
          '<span>' + escHtml(q.options[i]) + '</span></button>';
      }
      html += '</div>';
    } else {
      html += '<button class="quiz-reveal-btn" id="quiz-reveal-btn" onclick="quizReveal()">👆 Tap to Reveal Answer</button>' +
        '<div class="quiz-answer-reveal quiz-hidden" id="quiz-answer-reveal">' +
        '<div class="quiz-reveal-label">Answer</div><div>' + escHtml(q.answer) + '</div></div>' +
        '<div class="quiz-self-rate quiz-hidden" id="quiz-self-rate">' +
        '<button class="quiz-rate-btn knew-it" onclick="quizRate(true)">✓ I Knew It</button>' +
        '<button class="quiz-rate-btn didnt-know" onclick="quizRate(false)">✗ Didn\'t Know</button></div>';
    }

    html += '</div>';
    area.innerHTML = html;
  }

  window.quizSelect = function(idx) {
    if (qzAnswered) return;
    qzAnswered = true;
    var q = qzQuestions[qzIdx];
    var btns = document.querySelectorAll('.quiz-option');
    var card = document.getElementById('quiz-card');
    btns.forEach(function(b) { b.classList.add('disabled'); });
    btns[q.answer].classList.add('correct');
    if (idx === q.answer) {
      qzCorrect++;
      card.classList.add('quiz-card-correct');
      spawnConfetti(card);
    } else {
      qzWrong++;
      btns[idx].classList.add('wrong');
      card.classList.add('quiz-card-wrong');
    }
    if (q.explanation) {
      var expl = document.createElement('div');
      expl.className = 'quiz-explanation';
      expl.innerHTML = '<strong>💡 Explanation:</strong> ' + escHtml(q.explanation);
      card.appendChild(expl);
    }
    updateScoreDisplay();
    showNextBtn();
  };

  window.quizReveal = function() {
    document.getElementById('quiz-reveal-btn').classList.add('quiz-hidden');
    document.getElementById('quiz-answer-reveal').classList.remove('quiz-hidden');
    document.getElementById('quiz-self-rate').classList.remove('quiz-hidden');
  };

  window.quizRate = function(knew) {
    if (qzAnswered) return;
    qzAnswered = true;
    if (knew) { qzCorrect++; spawnConfetti(document.getElementById('quiz-card')); }
    else { qzWrong++; }
    document.querySelectorAll('.quiz-rate-btn').forEach(function(b) { b.style.pointerEvents = 'none'; b.style.opacity = '0.5'; });
    var q = qzQuestions[qzIdx];
    if (q.explanation) {
      var expl = document.createElement('div');
      expl.className = 'quiz-explanation';
      expl.innerHTML = '<strong>💡 Explanation:</strong> ' + escHtml(q.explanation);
      document.getElementById('quiz-card').appendChild(expl);
    }
    updateScoreDisplay();
    showNextBtn();
  };

  function updateScoreDisplay() {
    document.getElementById('quiz-score').textContent = 'Score: ' + qzCorrect + '/' + (qzIdx + 1);
    document.getElementById('quiz-correct').textContent = qzCorrect;
    document.getElementById('quiz-wrong').textContent = qzWrong;
  }

  function showNextBtn() {
    var btn = document.getElementById('quiz-next-btn');
    btn.textContent = qzIdx < qzQuestions.length - 1 ? 'Next →' : 'See Results';
    btn.classList.remove('quiz-hidden');
  }

  window.quizNext = function() {
    qzIdx++;
    if (qzIdx >= qzQuestions.length) showResults();
    else renderQ();
  };

  function showResults() {
    document.getElementById('quiz-screen').classList.add('quiz-hidden');
    var total = qzQuestions.length;
    var pct = Math.round((qzCorrect / total) * 100);
    var grade, gradeClass, message;
    if (pct >= 90) { grade = '🏆 Outstanding!'; gradeClass = 'grade-a'; message = 'You truly know your Android engineering. Keep pushing the boundaries.'; }
    else if (pct >= 70) { grade = '🌟 Great Job!'; gradeClass = 'grade-b'; message = 'Solid knowledge. Review the topics you missed to level up further.'; }
    else if (pct >= 50) { grade = '📚 Keep Learning!'; gradeClass = 'grade-c'; message = 'Good foundation. Dive deeper into the topics where you struggled.'; }
    else { grade = '💪 Don\'t Give Up!'; gradeClass = 'grade-d'; message = 'Every expert was once a beginner. Keep studying and try again.'; }

    var div = document.getElementById('quiz-results');
    div.innerHTML = '<div class="quiz-results-circle ' + gradeClass + '">' +
      '<div class="quiz-results-score">' + pct + '%</div>' +
      '<div class="quiz-results-sublabel">' + qzCorrect + ' of ' + total + '</div></div>' +
      '<div class="quiz-results-grade">' + grade + '</div>' +
      '<p class="quiz-results-msg">' + message + '</p>' +
      '<div class="quiz-results-stats">' +
      '<div class="quiz-stat-card"><div class="quiz-stat-value" style="color:#34d399">' + qzCorrect + '</div><div class="quiz-stat-label">Correct</div></div>' +
      '<div class="quiz-stat-card"><div class="quiz-stat-value" style="color:#f87171">' + qzWrong + '</div><div class="quiz-stat-label">Wrong</div></div>' +
      '<div class="quiz-stat-card"><div class="quiz-stat-value" style="color:#60a5fa">' + total + '</div><div class="quiz-stat-label">Total</div></div></div>' +
      '<button class="quiz-restart-btn" onclick="quizRestart()">Try Again</button>';
    div.classList.remove('quiz-hidden');
  }

  window.quizRestart = function() {
    document.getElementById('quiz-results').classList.add('quiz-hidden');
    document.getElementById('quiz-screen').classList.add('quiz-hidden');
    document.getElementById('quiz-start').classList.remove('quiz-hidden');
    qzDiff = null;
    document.querySelectorAll('.quiz-diff-btn').forEach(function(b) { b.classList.remove('selected'); });
    document.getElementById('quiz-go-btn').classList.remove('active');
  };

  function spawnConfetti(parent) {
    var colors = ['#34d399', '#60a5fa', '#fbbf24', '#a78bfa', '#f87171'];
    for (var i = 0; i < 14; i++) {
      var piece = document.createElement('div');
      piece.className = 'quiz-confetti-piece';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.left = Math.random() * 100 + '%';
      piece.style.top = Math.random() * 60 + '%';
      piece.style.animationDelay = Math.random() * 0.3 + 's';
      parent.appendChild(piece);
      setTimeout(function() { piece.remove(); }, 1200);
    }
  }

  function escHtml(str) {
    if (typeof str !== 'string') return str;
    var div = document.createElement('div');
    div.textContent = str;
    var result = div.innerHTML;
    result = result.replace(/`([^`]+)`/g, '<code style="background:rgba(96,165,250,0.12);padding:3px 8px;border-radius:6px;font-family:JetBrains Mono,monospace;font-size:0.95em;color:#79c0ff">$1</code>');
    return result;
  }
})();
</script>
