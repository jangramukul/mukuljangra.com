<!-- Post Navigation -->
<div class="post-navigation">
  <div class="nav-links">
    {% if page.previous.url %}
    <a class="prev-post" href="{{ page.previous.url }}" aria-label="Previous post">
      <span class="nav-arrow">←</span>
      <span class="nav-text">Prev</span>
    </a>
    {% endif %}
    
    {% if page.next.url %}
    <a class="next-post" href="{{ page.next.url }}" aria-label="Next post">
      <span class="nav-text">Next</span>
      <span class="nav-arrow">→</span>
    </a>
    {% endif %}
  </div>
</div>

<style>
  .post-navigation {
    margin-top: 80px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    width: 100%;
  }
  
  .nav-links {
    display: flex;
    justify-content: space-between;
    width: 100%;
    position: relative;
  }
  
  .prev-post, .next-post {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: auto;
    height: 36px;
    background-color: rgba(55, 65, 81, 0.3);
    border-radius: 9999px;
    text-decoration: none;
    color: #d1d5db;
    font-size: 14px;
    transition: all 0.2s ease;
    border: 1px solid rgba(75, 85, 99, 0.4);
    line-height: 1;
    padding: 0 16px;
    font-family: 'Inter', -apple-system, sans-serif;
    gap: 6px;
    font-weight: 500;
  }
  
  .prev-post:hover, .next-post:hover {
    background-color: rgba(96, 165, 250, 0.15);
    color: #ffffff;
    border-color: rgba(96, 165, 250, 0.3);
  }
  
  .prev-post {
    margin-right: auto;
  }
  
  .next-post {
    margin-left: auto;
  }
  
  .nav-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-size: 16px;
  }
  
  .nav-text {
    font-size: 13px;
    font-weight: 500;
  }
  
  @media (max-width: 600px) {
    .post-navigation {
      margin-top: 60px;
    }
    
    .prev-post, .next-post {
      height: 32px;
      padding: 0 12px;
      font-size: 12px;
    }
    
    .nav-arrow {
      font-size: 14px;
    }
    
    .nav-text {
      font-size: 12px;
    }
  }
</style>
