<!-- Post Navigation -->
<div class="post-navigation">
  <div class="nav-links">
    {% if page.previous.url %}
    <a class="prev-post" href="{{ page.previous.url }}" aria-label="Previous post">
      <span class="nav-arrow">←</span>
      <span class="nav-text">Prev</span>
    </a>
    {% endif %}
    
    {% if page.next.url %}
    <a class="next-post" href="{{ page.next.url }}" aria-label="Next post">
      <span class="nav-text">Next</span>
      <span class="nav-arrow">→</span>
    </a>
    {% endif %}
  </div>
</div>

<style>
  .post-navigation {
    margin-top: 80px; /* Increased from 40px to 80px for more space */
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    width: 100%;
  }
  
  .nav-links {
    display: flex;
    justify-content: space-between;
    width: 100%;
    position: relative;
    z-index: 100; /* Add high z-index */
  }
  
  .prev-post, .next-post {
    display: flex;
    justify-content: center;
    align-items: center;
    width: auto;
    height: 36px;
    background-color: transparent;
    border-radius: 0; /* Changed to 0 for completely square corners */
    text-decoration: none;
    color: #a2e02c;
    font-size: 14px;
    transition: background-color 0.3s, transform 0.2s;
    border: 2px solid #a2e02c;
    line-height: 0;
    padding: 0 12px;
    font-family: 'Source Code Pro', monospace;
    gap: 6px; /* Add spacing between arrow and text */
  }
  
  .prev-post:hover, .next-post:hover {
    background-color: rgba(162, 224, 44, 0.2);
    transform: translateY(-2px);
  }
  
  .prev-post {
    margin-right: auto;
  }
  
  .next-post {
    margin-left: auto;
  }
  
  .nav-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    transform: translateY(-1px);
    font-size: 18px; /* Arrow size */
  }
  
  .nav-text {
    font-size: 13px;
    font-weight: 600;
  }
  
  @media (max-width: 600px) {
    .post-navigation {
      margin-top: 60px; /* Slightly reduced for mobile but still more than original */
    }
    
    .prev-post, .next-post {
      height: 32px;
      padding: 0 10px;
      font-size: 12px;
      background-color: rgba(18, 18, 18, 0.9); /* Add background */
      position: relative;
      z-index: 100; /* Ensure high z-index */
      border: 2px solid rgba(162, 224, 44, 0.8); /* Make border more visible */
    }
    
    .nav-arrow {
      font-size: 16px;
    }
    
    .nav-text {
      font-size: 12px;
    }
  }
</style>
