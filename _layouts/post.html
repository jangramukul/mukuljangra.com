---
layout: default
---
<style type="text/css">
  .content.post {
    font-size: 16px; /* Changed from 1.08em to absolute value for better base sizing */
    line-height: 1.6;
    margin: 0 auto;
    color: var(--text-color);
    padding: 0 40px;
    padding-right: 20%;
    max-width: 100%;
    overflow-x: hidden;
    box-sizing: border-box;
    position: relative; /* For positioning the timeline */
  }

  .nav-links a span {
    font-size: 0.9em;
    opacity: 0.8;
    margin-right: 4px;
  }

  .back-header {
    font-family: 'Source Code Pro', monospace;
    font-size: 1.1em;
    margin-bottom: 15px;
    color: var(--text-color);
    font-weight: normal;
    text-decoration: none;
  }

  .back-header:hover {
    color: var(--link-color-hover);
  }

  .back-header a {
    color: var(--text-color);
    text-decoration: underline;
  }

  .back-header a:hover {
    color: var(--link-color-hover);
    text-decoration: underline;
  }

  .content.post h2 {
    font-family: 'Source Code Pro', monospace;
    font-size: 1.4em;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    color: var(--text-color);
    border-bottom: none;
    font-weight: bold;
  }

  .content.post h3 {
    font-family: 'Source Code Pro', monospace;
    font-size: 1.2em;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    color: var(--text-color);
    border-bottom: none;
    font-weight: bold;
  }

  .content.post h4 {
    font-family: 'Source Code Pro', monospace;
    font-size: 1.1em;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    color: var(--text-color);
    border-bottom: none;
    font-weight: bold;
  }

  /* Ensure text after headings maintains the same font size */
  .content.post h2 + p,
  .content.post h3 + p,
  .content.post h4 + p,
  .content.post h2 + ul,
  .content.post h3 + ul,
  .content.post h4 + ul,
  .content.post h2 + ol,
  .content.post h3 + ol,
  .content.post h4 + ol {
    font-size: 1.08em;
  }

  .content.post p {
    font-size: 1.08em;
    margin-bottom: 1.5em;
    color: var(--text-color);
  }

  .content.post p.date {
    font-size: 0.9em;
    color: #666;
  }

  .content.post ul,
  .content.post ol {
    font-size: 1.01em;
    margin-top: 0.5em;
    margin-bottom: 1.5em;
    padding-left: 1.5em;
    color: var(--text-color);
  }

  .content.post li {
    font-size: 1.01em;
    margin-bottom: 0.5em;
    color: var(--text-color);
  }

  .content.post li:last-child {
    margin-bottom: 0;
  }

  .content.post code {
    background-color: var(--code-bg);
    color: var(--text-color);
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .content.post pre {
    background-color: var(--code-bg);
    color: var(--text-color);
    max-width: 100%;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .content.post blockquote {
    border-left: 4px solid var(--blockquote-border);
    padding-left: 1em;
    color: var(--blockquote-color);
  }

  .category-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .category-chip {
    padding: 6px 12px;
    background-color: #333;
    border-radius: 20px;
    font-size: 0.7em;
    cursor: pointer;
    transition: all 0.2s ease;
    color: white;
    text-decoration: none;
  }

  .category-chip:hover {
    background-color: #e0e0e0;
    color: #333;
  }

  .category-chip.active {
    background-color: #333;
    color: white;
  }
  
  .post-title {
    border-bottom: 5px solid #f9bf3b !important;
    padding-bottom: 2px;
    display: inline-block;
    margin-top: 0.5em !important;
  }

  /* Timeline Styles */
  .scroll-timeline {
    position: fixed;
    right: 5%;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 250px;
    background-color: #e0e0e0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
  }

  .timeline-point {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: #e0e0e0;
    transition: background-color 0.3s ease;
    margin-left: -4.5px;
    position: relative;
  }

  .timeline-point.active {
    background-color: #f9bf3b;
  }

  .timeline-bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 3px;
    height: 0%;
    background-color: #f9bf3b;
    z-index: -1;
  }
</style>

<div class="content post">
  <div class="scroll-timeline">
    <div class="timeline-bar"></div>
    <div class="timeline-point" data-position="0"></div>
    <div class="timeline-point" data-position="25"></div>
    <div class="timeline-point" data-position="50"></div>
    <div class="timeline-point" data-position="75"></div>
    <div class="timeline-point" data-position="100"></div>
  </div>
  <h1 class="back-header"><a href="javascript:history.back()">Back</a></h1>
  <h2 class="post-title">{{ page.title }}</h2>
  <p class="date">{{ page.date | date:"%d %B %Y" }}</p>
  {% if page.tags %}
  <div class="category-chips">
    {% for tag in page.tags %}
    <a href="/?tag={{ tag | replace: ' ', '_' }}" class="category-chip" data-tag="{{ tag | replace: ' ', '_' }}">{{ tag }}</a>
    {% endfor %}
  </div>
  {% endif %}
  {{ content }}
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const timelinePoints = document.querySelectorAll('.timeline-point');
      const timelineBar = document.querySelector('.timeline-bar');
      
      function updateTimeline() {
        // Calculate how far down the page the user has scrolled
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrollPercent = (scrollTop / docHeight) * 100;
        
        // Update the timeline bar height
        timelineBar.style.height = scrollPercent + '%';
        
        // Update the active points
        timelinePoints.forEach(point => {
          const position = parseInt(point.getAttribute('data-position'));
          if (scrollPercent >= position) {
            point.classList.add('active');
          } else {
            point.classList.remove('active');
          }
        });
      }
      
      // Update timeline on scroll
      window.addEventListener('scroll', updateTimeline);
      
      // Initialize timeline on page load
      updateTimeline();
    });
  </script>
</div>
