---
layout: default
---
<style type="text/css">
  .content.post {
    font-size: 1.08em;
    line-height: 1.6;
    margin: 32px 0 0 0;
    color: var(--text-color);
    padding: 0 40px;
    padding-right: 20%;
    width: 70%;
    max-width: none;
    overflow-x: hidden;
    box-sizing: border-box;
    background: #fafbfc;
    border: 1px solid #e0e0e0;
    border-radius: 0;
    box-shadow: none;
    min-height: 200px;
  }

  .nav-links a span {
    font-size: 0.9em;
    opacity: 0.8;
    margin-right: 4px;
  }

  .back-header {
    font-family: 'Source Code Pro', monospace;
    font-size: 1em;
    margin-bottom: 18px;
    color: #888;
    font-weight: 600;
    text-decoration: none;
    background: #f3f3f3;
    border: 1px solid #e0e0e0;
    border-radius: 0 0 8px 0;
    padding: 8px 16px 8px 12px;
    display: inline-block;
    box-shadow: none;
    margin-top: 24px;
  }

  .back-header a {
    color: inherit;
    text-decoration: none;
  }

  .back-header:hover, .back-header a:hover {
    background: #eaeaea;
    color: #111;
    text-decoration: none;
  }

  .content.post h2 {
    font-family: 'Source Code Pro', monospace;
    font-size: 1.4em;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    color: var(--text-color);
    border-bottom: none;
    font-weight: bold;
  }

  .content.post h3 {
    font-family: 'Source Code Pro', monospace;
    font-size: 1.2em;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    color: var(--text-color);
    border-bottom: none;
    font-weight: bold;
  }

  .content.post h4 {
    font-family: 'Source Code Pro', monospace;
    font-size: 1.1em;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    color: var(--text-color);
    border-bottom: none;
    font-weight: bold;
  }

  .content.post p {
    font-size: 1.08em;
    margin-bottom: 1.5em;
    color: var(--text-color);
  }

  .content.post ul,
  .content.post ol {
    margin-top: 0.5em;
    margin-bottom: 1.5em;
    padding-left: 1.5em;
    color: var(--text-color);
  }

  .content.post li {
    margin-bottom: 0.5em;
    color: var(--text-color);
  }

  .content.post li:last-child {
    margin-bottom: 0;
  }

  .content.post code {
    background-color: var(--code-bg);
    color: var(--text-color);
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .content.post pre {
    background-color: var(--code-bg);
    color: var(--text-color);
    max-width: 100%;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .content.post blockquote {
    border-left: 4px solid var(--blockquote-border);
    padding-left: 1em;
    color: var(--blockquote-color);
  }

  .category-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  .category-chip {
    padding: 5px 12px;
    background-color: #fafbfc;
    border: 1px solid #e0e0e0;
    border-radius: 0;
    font-size: 0.92em;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #333;
    font-family: 'Source Code Pro', monospace;
    font-weight: 600;
    box-shadow: none;
    margin: 0;
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .category-chip:hover {
    background-color: #f3f3f3;
    color: #111;
  }

  .category-chip.active {
    background-color: #333;
    color: white;
    border-color: #333;
  }
</style>

<div class="content post">
  <h1 class="back-header"><a href="javascript:history.back()">Back</a></h1>
  <h2>{{ page.title }}</h2>
  <p class="date">{{ site.site_name }} · {{ page.date | date:"%d %B %Y" }}</p>
  {% if page.tags %}
  <div class="category-chips">
    {% for tag in page.tags %}
    <a href="/?tag={{ tag | replace: ' ', '_' }}" class="category-chip" data-tag="{{ tag | replace: ' ', '_' }}">{{ tag }}</a>
    {% endfor %}
  </div>
  {% endif %}
  {{ content }}
</div>
