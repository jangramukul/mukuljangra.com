<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.site_name }}</title>
    <link rel="icon" type="image/svg+xml" href="/static/space-favicon.svg">
    <link rel="stylesheet" href="/static/bootstrap-3.1.1.min.css" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" type="text/css">
    <link rel="stylesheet" href="/static/gradient-bg.css" type="text/css">
    <link rel="stylesheet" href="/static/nav.css" type="text/css">
    <link rel="stylesheet" href="/static/syntax.css" type="text/css">
    <link rel="stylesheet" href="/static/dark-mode.css" type="text/css">
    <link rel="stylesheet" href="/static/footer.css" type="text/css">
    <link type="application/atom+xml" rel="alternate" href="{{ site.url }}/atom.xml" />
    <meta name="theme-color" content="#000000">
    <style type="text/css">
      :root {
        --link-color: #00E5D0;
        --link-color-hover: #7ffff4;
        --accent: #00E5D0;
      }

      body {
        background-color: #000000;
        color: #e5e7eb;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Reading progress bar */
      #read-progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        width: 0%;
        background: #00E5D0;
        z-index: 9999;
        transition: width 0.1s linear;
        box-shadow: 0 0 8px rgba(0, 229, 208, 0.5);
      }

      .right-column {
        width: 100%;
        flex: 1;
        padding: 0 40px 80px;
        max-width: 1200px;
        margin: 0 auto;
        box-sizing: border-box;
      }

      /* Article header area */
      .article-header {
        max-width: 720px;
        margin: 0 auto;
        padding-top: 110px;
        padding-bottom: 48px;
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #4b5563;
        font-family: 'Space Mono', monospace;
        font-size: 0.68em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-decoration: none;
        transition: all 0.2s ease;
        margin-bottom: 40px;
      }

      .back-button:hover {
        color: #00E5D0;
        border-color: rgba(0, 229, 208, 0.35);
        background: rgba(0, 229, 208, 0.04);
        text-decoration: none;
      }

      .article-eyebrow {
        font-family: 'Space Mono', monospace;
        font-size: 0.72em;
        color: #00E5D0;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      .article-title {
        font-family: 'Space Mono', 'Courier New', monospace;
        font-size: 2.2em;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.15;
        letter-spacing: 0.02em;
        margin: 0 0 24px 0;
      }

      .article-meta {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 0;
      }

      .article-date {
        font-family: 'Space Mono', monospace;
        font-size: 0.72em;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .meta-dot {
        color: #1f2937;
        font-size: 0.6em;
      }

      .article-reading-time {
        font-family: 'Space Mono', monospace;
        font-size: 0.72em;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .article-tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .article-tag {
        padding: 2px 9px;
        background: rgba(0, 229, 208, 0.06);
        border: 1px solid rgba(0, 229, 208, 0.15);
        font-family: 'Space Mono', monospace;
        font-size: 0.65em;
        font-weight: 700;
        color: rgba(0, 229, 208, 0.7);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      /* Article divider */
      .article-divider {
        max-width: 720px;
        margin: 0 auto 48px;
        height: 1px;
        background: rgba(0, 229, 208, 0.1);
      }

      /* Article body */
      .article-body {
        max-width: 720px;
        margin: 0 auto;
        font-size: 18px;
        line-height: 1.85;
        color: #9ca3af;
      }

      .article-body h1,
      .article-body h2 {
        font-family: 'Space Mono', monospace;
        font-size: 1.2em;
        font-weight: 700;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-left: 2px solid #00E5D0;
        padding: 4px 0 4px 14px;
        margin: 2.2em 0 0.9em;
        line-height: 1.3;
      }

      .article-body h3 {
        font-family: 'Space Mono', monospace;
        font-size: 1em;
        font-weight: 700;
        color: #d1d5db;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-left: 2px solid rgba(0, 229, 208, 0.4);
        padding: 3px 0 3px 12px;
        margin: 1.8em 0 0.8em;
      }

      .article-body h4 {
        font-family: 'Space Mono', monospace;
        font-size: 0.88em;
        font-weight: 700;
        color: #9ca3af;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-left: 1px solid rgba(0, 229, 208, 0.25);
        padding: 2px 0 2px 10px;
        margin: 1.5em 0 0.7em;
      }

      .article-body p {
        margin-bottom: 1.5em;
        color: #9ca3af;
        line-height: 1.85;
      }

      .article-body a {
        color: #00E5D0;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .article-body a:hover { color: #7ffff4; }

      .article-body ul,
      .article-body ol {
        padding-left: 1.8em;
        margin-bottom: 1.5em;
        color: #9ca3af;
      }

      .article-body li {
        margin-bottom: 0.6em;
        line-height: 1.75;
      }

      .article-body code {
        background: #0d0d0d;
        color: #00E5D0;
        padding: 2px 6px;
        font-family: 'Space Mono', monospace;
        font-size: 0.84em;
        border: 1px solid rgba(0, 229, 208, 0.12);
        border-radius: 0;
        word-break: break-word;
      }

      .article-body pre {
        background: #0d0d0d;
        border: 1px solid rgba(0, 229, 208, 0.1);
        padding: 20px 24px;
        overflow-x: auto;
        margin: 0 0 1.5em;
        border-radius: 0;
      }

      .article-body pre code {
        background: transparent;
        border: none;
        color: #e5e7eb;
        padding: 0;
        font-size: 0.88em;
        word-break: normal;
      }

      .article-body .highlight {
        margin-bottom: 1.5em;
        border: 1px solid rgba(0, 229, 208, 0.1);
        overflow: hidden;
      }

      .article-body .highlight pre {
        margin: 0;
        border: none;
      }

      .article-body blockquote {
        border-left: 2px solid rgba(0, 229, 208, 0.5);
        padding: 12px 20px;
        margin: 1.5em 0;
        background: rgba(0, 229, 208, 0.03);
        color: #6b7280;
        font-style: italic;
      }

      .article-body blockquote p { margin-bottom: 0; color: inherit; }

      .article-body img {
        max-width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.06);
        display: block;
        margin: 1.5em auto;
      }

      .article-body hr {
        border: none;
        border-top: 1px solid rgba(0, 229, 208, 0.08);
        margin: 2.5em 0;
      }

      .article-body strong { color: #e5e7eb; font-weight: 600; }
      .article-body em { color: #9ca3af; }

      /* Table */
      .article-body table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1.5em;
        font-size: 0.88em;
      }

      .article-body th {
        background: rgba(0, 229, 208, 0.04);
        color: #d1d5db;
        font-family: 'Space Mono', monospace;
        font-size: 0.78em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(0, 229, 208, 0.12);
        text-align: left;
      }

      .article-body td {
        padding: 10px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        color: #9ca3af;
        vertical-align: top;
      }

      .article-body tr:last-child td { border-bottom: none; }
      .article-body tr:hover td { background: rgba(0, 229, 208, 0.015); }

      /* Post footer nav */
      .article-footer {
        max-width: 720px;
        margin: 64px auto 0;
        padding-top: 24px;
        border-top: 1px solid rgba(0, 229, 208, 0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .article-footer-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #4b5563;
        font-family: 'Space Mono', monospace;
        font-size: 0.68em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .article-footer-back:hover {
        color: #00E5D0;
        border-color: rgba(0, 229, 208, 0.35);
        background: rgba(0, 229, 208, 0.04);
        text-decoration: none;
      }

      @media (max-width: 768px) {
        .right-column { padding: 0 20px 60px; }
        .article-header { padding-top: 80px; padding-bottom: 32px; }
        .article-title { font-size: 1.6em; }
        .article-body { font-size: 16px; }
        .article-footer { margin-top: 48px; }
      }
    </style>
  </head>
  <body>
    <div id="read-progress"></div>
    {% include site-nav.html %}
    <div class="gradient-bg"></div>
    <div class="main-background"></div>

    <div class="right-column">

      <div class="article-header">
        <a href="javascript:history.length>1?history.back():window.location='/'" class="back-button">
          ← Back
        </a>

        <div class="article-eyebrow">// Article</div>
        <h1 class="article-title">{{ page.title }}</h1>

        <div class="article-meta">
          <span class="article-date">{{ page.date | date: "%d %B %Y" }}</span>
          <span class="meta-dot">◆</span>
          <span class="article-reading-time" id="reading-time">— min read</span>
          {% if page.tags and page.tags != empty %}
          <span class="meta-dot">◆</span>
          <div class="article-tags">
            {% for tag in page.tags %}<span class="article-tag">{{ tag }}</span>{% endfor %}
          </div>
          {% endif %}
        </div>
      </div>

      <div class="article-divider"></div>

      <div class="article-body" id="article-content">
        {{ content }}
      </div>

      <div class="article-footer">
        <a href="javascript:history.length>1?history.back():window.location='/'" class="article-footer-back">
          ← Back to Writing
        </a>
      </div>

    </div>

    {% include footer.html %}

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        document.documentElement.setAttribute('data-theme', 'dark');

        // Reading progress bar
        var bar = document.getElementById('read-progress');
        window.addEventListener('scroll', function() {
          var scrollTop = window.scrollY || document.documentElement.scrollTop;
          var docHeight = document.documentElement.scrollHeight - window.innerHeight;
          bar.style.width = (docHeight > 0 ? Math.min(100, (scrollTop / docHeight) * 100) : 0) + '%';
        }, { passive: true });

        // Reading time estimate
        var content = document.getElementById('article-content');
        if (content) {
          var words = content.innerText.trim().split(/\s+/).length;
          var mins = Math.max(1, Math.round(words / 200));
          document.getElementById('reading-time').textContent = mins + ' min read';
        }
      });
    </script>
  </body>
</html>
