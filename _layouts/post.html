<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.site_name }}</title>
    <!-- Emoji favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/space-favicon.svg">
    <link rel="stylesheet" href="/static/bootstrap-3.1.1.min.css" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" type="text/css">
    <link rel="stylesheet" href="/static/app.css" type="text/css">
    <link rel="stylesheet" href="/static/syntax.css" type="text/css">
    <link type="application/atom+xml" rel="alternate" href="{{ site.url }}/atom.xml" />
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="/static/gradient-bg.css" type="text/css">
    <link rel="stylesheet" href="/static/footer.css" type="text/css">
    <style type="text/css">
      :root {
        --background-color: #000000;
        --text-color: #e5e7eb;
        --sidebar-bg: #0a0a0a;
        --code-bg: #0d0d0d;
        --blockquote-color: #6b7280;
        --blockquote-border: rgba(0, 229, 208, 0.35);
        --link-color: #00E5D0;
        --link-color-hover: #7ffff4;
        --accent: #00E5D0;
        --accent-dim: rgba(0, 229, 208, 0.15);
        --accent-border: rgba(0, 229, 208, 0.3);
      }

      /* Ensure backgrounds are transparent to show gradient */
      body, .right-column, .content, .content.post {
        background-color: transparent !important;
      }

      body {
        color: var(--text-color);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Fixed top navigation */
      .site-nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        z-index: 1000;
        border-bottom: 1px solid rgba(0, 229, 208, 0.08);
        background: rgba(0, 0, 0, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .nav-logo {
        font-family: 'Space Mono', 'Courier New', monospace;
        font-size: 0.85em;
        font-weight: 700;
        color: #ffffff;
        text-decoration: none;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .nav-logo:hover {
        color: #00E5D0;
        text-decoration: none;
      }

      .nav-right {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .nav-link {
        font-family: 'Space Mono', 'Courier New', monospace;
        font-size: 0.72em;
        color: #6b7280;
        text-decoration: none;
        letter-spacing: 0.08em;
        transition: color 0.2s ease;
        text-transform: uppercase;
      }

      .nav-link:hover {
        color: #00E5D0;
        text-decoration: none;
      }

      .nav-cta {
        font-family: 'Space Mono', 'Courier New', monospace;
        font-size: 0.72em;
        color: #00E5D0;
        border: 1px solid rgba(0, 229, 208, 0.5);
        padding: 7px 16px;
        text-decoration: none;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: all 0.2s ease;
      }

      .nav-cta:hover {
        background: rgba(0, 229, 208, 0.08);
        color: #00E5D0;
        border-color: #00E5D0;
        text-decoration: none;
        box-shadow: 0 0 12px rgba(0, 229, 208, 0.2);
      }

      .right-column {
        width: 100%;
        flex: 1;
        padding: 40px;
        max-width: 1200px;
        margin: 0 auto;
      }
      
      .content {
        max-width: 1000px;
        margin: 0 auto;
      }
      
      .content.post {
        font-size: 18px;
        line-height: 1.8;
        margin: 0 auto;
        color: var(--text-color);
        max-width: 1000px;
        overflow-x: hidden;
        box-sizing: border-box;
        padding: 0;
        width: 100%;
      }

      .back-header {
        font-family: 'Space Mono', monospace;
        font-size: 0.9em;
        margin-bottom: 15px;
        color: var(--text-color);
        font-weight: normal;
        text-decoration: none;
      }

      .back-header:hover {
        color: var(--link-color-hover);
      }

      .back-header a {
        color: var(--text-color);
        text-decoration: underline;
      }

      .back-header a:hover {
        color: var(--link-color-hover);
        text-decoration: underline;
      }

      .content.post h2 {
        font-family: 'Space Mono', 'Courier New', monospace;
        font-size: 1.35em;
        margin-top: 2em;
        margin-bottom: 0.8em;
        color: #ffffff;
        border-left: 2px solid #00E5D0;
        padding: 4px 0 4px 14px;
        border-bottom: none;
        border-image: none;
        font-weight: 700;
        width: 100%;
        max-width: 100%;
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .content.post h3 {
        font-family: 'Space Mono', 'Courier New', monospace;
        font-size: 1.1em;
        margin-top: 1.8em;
        margin-bottom: 0.8em;
        color: #d1d5db;
        border-left: 2px solid rgba(0, 229, 208, 0.4);
        padding: 2px 0 2px 12px;
        border-bottom: none;
        border-image: none;
        font-weight: 700;
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .content.post h4 {
        font-family: 'Space Mono', 'Courier New', monospace;
        font-size: 0.95em;
        margin-top: 1.5em;
        margin-bottom: 0.8em;
        color: #9ca3af;
        border-left: 1px solid rgba(0, 229, 208, 0.25);
        padding: 1px 0 1px 10px;
        border-bottom: none;
        border-image: none;
        font-weight: 700;
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .content.post h2 + p,
      .content.post h3 + p,
      .content.post h4 + p,
      .content.post h2 + ul,
      .content.post h3 + ul,
      .content.post h4 + ul,
      .content.post h2 + ol,
      .content.post h3 + ol,
      .content.post h4 + ol {
        font-size: 1.05em;
      }

      .content.post p {
        font-size: 1.05em;
        margin-bottom: 1.5em;
        color: #9ca3af;
        max-width: 100%;
        box-sizing: border-box;
        line-height: 1.85;
      }

      .content.post p.date {
        font-size: 0.8em;
        color: #374151;
        font-family: 'Space Mono', monospace;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .content.post ul,
      .content.post ol {
        font-size: 1.05em;
        margin-top: 0.5em;
        margin-bottom: 1.5em;
        padding-left: 2em;
        color: #9ca3af;
        max-width: 100%;
        box-sizing: border-box;
        list-style-position: outside;
      }

      .content.post h2 + ul,
      .content.post h2 + ol,
      .content.post h3 + ul,
      .content.post h3 + ol,
      .content.post h4 + ul,
      .content.post h4 + ol {
        padding-left: 2.5em;
        margin-top: 1em;
      }

      .content.post li {
        font-size: 1em;
        margin-bottom: 0.5em;
        color: #9ca3af;
        padding-left: 0.25em;
      }

      .content.post li:last-child {
        margin-bottom: 0;
      }

      .content.post code {
        background-color: #0d0d0d;
        color: #00E5D0;
        word-wrap: break-word;
        white-space: pre-wrap;
        padding: 2px 6px;
        border-radius: 0;
        font-size: 0.88em;
        border: 1px solid rgba(0, 229, 208, 0.15);
        font-family: 'Space Mono', 'Courier New', monospace;
      }

      .content.post pre {
        background-color: #0d0d0d;
        color: #e5e7eb;
        max-width: 100%;
        overflow-x: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        width: 100%;
        box-sizing: border-box;
        border-radius: 0;
        padding: 20px;
        border: 1px solid rgba(0, 229, 208, 0.1);
      }

      .content.post .highlight {
        border-radius: 0;
        overflow: hidden;
        margin-bottom: 1.5em;
        border: 1px solid rgba(0, 229, 208, 0.1);
      }

      .content.post .highlight pre {
        margin: 0;
        border-radius: 0;
        border: none;
      }

      .content.post pre code {
        padding: 0;
        border-radius: 0;
        background-color: transparent;
        border: none;
        color: inherit;
      }

      .content.post blockquote {
        border-left: 2px solid rgba(0, 229, 208, 0.4);
        padding-left: 1em;
        color: var(--blockquote-color);
        border-radius: 0;
        background-color: rgba(0, 229, 208, 0.03);
        padding: 12px 16px 12px 16px;
        overflow: hidden;
        font-size: 1em;
      }

      .content.post a {
        color: #00E5D0;
      }

      .content.post a:hover {
        color: #7ffff4;
      }

      .category-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      
      /* Back button styles */
      .back-navigation {
        margin-bottom: 20px;
        width: 100%;
        padding-top: 80px;
        padding-bottom: 48px;
      }
      
      .back-button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: auto;
        height: 34px;
        background-color: transparent;
        border-radius: 0;
        text-decoration: none;
        color: #4b5563;
        font-size: 0.75em;
        transition: all 0.2s ease;
        border: 1px solid rgba(255, 255, 255, 0.08);
        line-height: 1;
        padding: 0 16px;
        font-family: 'Space Mono', monospace;
        gap: 8px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      
      .back-button:hover {
        background-color: rgba(0, 229, 208, 0.06);
        color: #00E5D0;
        border-color: rgba(0, 229, 208, 0.4);
      }
      
      .back-button .nav-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 14px;
      }
      
      .back-button .nav-text {
        font-size: 0.9em;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      
      @media (max-width: 600px) {
        .back-navigation {
          padding-top: 70px;
          padding-bottom: 32px;
        }
        
        .back-button {
          height: 30px;
          padding: 0 12px;
          font-size: 0.7em;
        }
        
        .back-button .nav-arrow {
          font-size: 12px;
        }
      }

      .category-chip {
        padding: 3px 10px;
        background-color: rgba(255, 255, 255, 0.04);
        border-radius: 0;
        font-size: 0.7em;
        transition: all 0.2s ease;
        user-select: none;
        color: #6b7280;
        border: 1px solid transparent;
        font-family: 'Space Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 700;
      }
      
      .date-tag-container {
        display: flex;
        align-items: center;
        margin-bottom: 32px;
        gap: 12px;
        flex-wrap: wrap;
      }
      
      .content.post p.date {
        font-size: 0.78em;
        color: #374151;
        margin-bottom: 0;
        margin-right: 0;
        font-family: 'Space Mono', monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      
      /* Post title */
      .post-title {
        border: none !important;
        border-bottom: none !important;
        border-image: none !important;
        border-left: none !important;
        background: none !important;
        display: block !important;
        margin-top: 0 !important;
        margin-bottom: 16px !important;
        padding: 0 !important;
        text-decoration: none !important;
        font-size: 2.4em !important;
        color: #ffffff !important;
        font-family: 'Space Mono', 'Courier New', monospace !important;
        font-weight: 700 !important;
        text-transform: none !important;
        line-height: 1.1 !important;
        letter-spacing: 0.02em !important;
      }
      
      h2.post-title {
        border: none !important;
        border-bottom: none !important;
        border-image: none !important;
        border-left: none !important;
        background: none !important;
        padding: 0 !important;
        text-decoration: none !important;
        display: block !important;
        color: #ffffff !important;
        position: static !important;
        font-size: 2.4em !important;
        text-transform: none !important;
        letter-spacing: 0.02em !important;
      }
      
      h2.post-title::before,
      h2.post-title::after,
      .post-title::before,
      .post-title::after {
        display: none !important;
        content: none !important;
      }

      @media (max-width: 768px) {
        .site-nav {
          padding: 0 20px;
          height: 50px;
        }
        .nav-logo {
          font-size: 0.75em;
        }
        .nav-right {
          gap: 12px;
        }
        .nav-link {
          font-size: 0.62em;
        }
        .nav-cta {
          font-size: 0.62em;
          padding: 5px 10px;
        }
        .right-column {
          padding: 20px;
        }
        
        .content {
          padding: 0;
          max-width: 100%;
          width: 100%;
        }
        
        .content.post {
          padding: 0;
          max-width: 100%;
          width: 100%;
        }

        .post-title {
          font-size: 1.7em !important;
        }

        h2.post-title {
          font-size: 1.7em !important;
        }
      }

      .post-navigation {
        margin-top: 80px;
        padding-top: 20px;
        border-top: 1px solid rgba(0, 229, 208, 0.08);
        width: 100%;
      }

      .nav-links {
        display: flex;
        justify-content: space-between;
        width: 100%;
      }

      .prev-post {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        height: 34px;
        background-color: transparent;
        border-radius: 0;
        text-decoration: none;
        color: #4b5563;
        font-size: 0.75em;
        transition: all 0.2s ease;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 0 16px;
        font-family: 'Space Mono', monospace;
        gap: 8px;
        font-weight: 700;
        margin-right: auto;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .prev-post:hover {
        background-color: rgba(0, 229, 208, 0.06);
        color: #00E5D0;
        border-color: rgba(0, 229, 208, 0.4);
        text-decoration: none;
      }

      @media (max-width: 600px) {
        .post-navigation { margin-top: 60px; }
        .prev-post { height: 30px; padding: 0 12px; font-size: 0.7em; }
      }
    </style>
  </head>
  <body>
    <nav class="site-nav">
      <a href="/" class="nav-logo">Mukul Jangra</a>
      <div class="nav-right">
        <a href="{{ site.site_github }}" class="nav-link" rel="noopener">GitHub</a>
        <a href="{{ site.site_mastodon }}" class="nav-link" rel="me noopener">Mastodon</a>
        <a href="/resources" class="nav-cta">Interview Prep →</a>
      </div>
    </nav>
    <div class="gradient-bg"></div>
    <div class="main-background" style="z-index: -2;"></div>

    <div class="right-column">
      <div class="content post" style="background-color: transparent !important;">
        <div class="back-navigation">
          <a href="#" id="back-to-home" class="back-button" onclick="event.preventDefault(); if (history.length > 1) { history.back(); } else { window.location.href = '/'; }">
            <span class="nav-arrow">←</span>
            <span class="nav-text">Back</span>
          </a>
        </div>
        <h2 class="post-title">{{ page.title }}</h2>
        <div class="date-tag-container">
          <p class="date">{{ page.date | date:"%d %B %Y" }}</p>
        </div>

        {{ content }}
        
        <!-- Back button -->
        <div class="post-navigation">
          <div class="nav-links">
            <a href="#" class="prev-post" onclick="event.preventDefault(); if (history.length > 1) { history.back(); } else { window.location.href = '/'; }">
              <span class="nav-arrow">←</span>
              <span class="nav-text">Back</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      });
    </script>
    
    {% include footer.html %}
  </body>
</html>
