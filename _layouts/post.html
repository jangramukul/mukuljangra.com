<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.site_name }}</title>
  <link rel="icon" type="image/jpeg" href="/static/profile.jpg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/sidebar.css">
  <link rel="stylesheet" href="/static/syntax.css">
  <link type="application/atom+xml" rel="alternate" href="{{ site.url }}/atom.xml" />
  <meta name="theme-color" content="#2d2d2f">
  <style>
    html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    #read-progress {
      position: fixed; top: 0; left: 0;
      height: 2px; width: 0%;
      background: #1a1a1a;
      z-index: 9999;
      transition: width 0.08s linear;
    }

    .shell { display: flex; min-height: 100vh; overflow-x: hidden; }

    /* Main */
    .main { margin-left: 380px; flex: 1; background: #ffffff; min-width: 0; overflow-x: hidden; }

    .article-wrap {
      width: 70%;
      padding: 60px 0 80px 56px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8em;
      color: #aaa;
      text-decoration: none;
      margin-bottom: 36px;
      transition: color 0.15s;
    }

    .back-link:hover { color: #1a1a1a; text-decoration: none; }

    .article-title {
      font-size: 1.75em;
      font-weight: 600;
      color: #1a1a1a;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .article-meta {
      font-size: 0.8em;
      color: #aaa;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .article-tag {
      font-size: 0.9em;
      padding: 1px 7px;
      border: 1px solid #e0e0e0;
      color: #888;
      border-radius: 3px;
    }

    .article-divider { border-top: 1px solid #ebebeb; margin-bottom: 36px; }

    /* Body */
    .article-body {
      font-size: 1.0625rem;
      line-height: 1.85;
      color: #333;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .article-body h1, .article-body h2 {
      font-size: 1.15em; font-weight: 600;
      color: #1a1a1a; margin: 2em 0 0.7em;
      line-height: 1.3;
    }

    .article-body h3 {
      font-size: 1em; font-weight: 600;
      color: #333; margin: 1.8em 0 0.6em;
    }

    .article-body h4 { font-size: 0.95em; font-weight: 600; color: #555; margin: 1.5em 0 0.5em; }

    .article-body p { margin-bottom: 1.4em; }
    .article-body a { color: #1a1a1a; text-decoration: underline; text-underline-offset: 2px; }
    .article-body a:hover { color: #555; }

    .article-body ul, .article-body ol { padding-left: 1.6em; margin-bottom: 1.4em; }
    .article-body li { margin-bottom: 0.4em; }

    .article-body code {
      font-family: 'SF Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
      font-size: 0.68em; background: #f6f8fa;
      padding: 1px 4px; border-radius: 3px; color: #24292f;
    }

    .article-body pre {
      background: #f6f8fa; border: 1px solid #d0d7de;
      padding: 12px 14px; overflow-x: auto;
      border-radius: 6px; margin-bottom: 1.2em;
    }

    .article-body pre code { background: none; padding: 0; font-size: 0.7em; color: #24292f; }

    .article-body .highlight { margin-bottom: 1.2em; border: 1px solid #d0d7de; border-radius: 6px; overflow: hidden; }
    .article-body .highlight pre { margin: 0; border: none; border-radius: 0; padding: 12px 14px; }

    .article-body blockquote {
      border-left: 3px solid #ddd; padding: 4px 0 4px 18px;
      color: #666; margin: 1.4em 0; font-style: italic;
    }

    .article-body img { border: 1px solid #ebebeb; border-radius: 3px; margin: 1.4em auto; }
    .article-body hr { border: none; border-top: 1px solid #ebebeb; margin: 2em 0; }
    .article-body strong { color: #1a1a1a; }

    .article-body table { margin-bottom: 1.4em; }
    .article-body th { background: #f6f6f6; }

    .article-footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #ebebeb;
    }

    .back-link-footer {
      font-size: 0.82em; color: #aaa;
      text-decoration: none; display: inline-flex;
      align-items: center; gap: 6px; transition: color 0.15s;
    }

    .back-link-footer:hover { color: #1a1a1a; text-decoration: none; }

    @media (max-width: 720px) {
      .shell { flex-direction: column; }
      .sidebar { position: static; width: 100%; min-width: 0; padding: 20px 24px; }
      .main { margin-left: 0; }
      .article-wrap { padding: 32px 24px 60px; }
      .article-title { font-size: 1.4em; }
    }
  </style>
</head>
<body>
<div id="read-progress"></div>
<div class="shell">

  {% include sidebar.html %}

  <main class="main">
    <div class="article-wrap">
      <a href="javascript:history.length>1?history.back():window.location='/'" class="back-link">← Writing</a>

      <h1 class="article-title">{{ page.title }}</h1>
      <div class="article-meta">
        <span>{{ page.date | date: "%B %d, %Y" }}</span>
        <span id="reading-time"></span>
        {% if page.tags %}
          {% for tag in page.tags %}<span class="article-tag">{{ tag }}</span>{% endfor %}
        {% endif %}
      </div>

      <div class="article-divider"></div>

      <div class="article-body" id="article-content">
        {{ content }}
      </div>

      <div class="article-footer">
        <a href="javascript:history.length>1?history.back():window.location='/'" class="back-link-footer">← Back to Writing</a>
      </div>
    </div>
  </main>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var bar = document.getElementById('read-progress');
  window.addEventListener('scroll', function() {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? Math.min(100, window.scrollY / h * 100) : 0) + '%';
  }, { passive: true });

  var content = document.getElementById('article-content');
  if (content) {
    var words = content.innerText.trim().split(/\s+/).length;
    var mins = Math.max(1, Math.round(words / 200));
    document.getElementById('reading-time').textContent = mins + ' min read';
  }
});
</script>
</body>
</html>
