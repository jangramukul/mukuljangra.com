---
layout: default
---
<style type="text/css">
  .content.post {
    font-size: 16px; /* Changed from 1.08em to absolute value for better base sizing */
    line-height: 1.6;
    margin: 0 auto;
    color: var(--text-color);
    padding: 0 40px;
    padding-right: 20%;
    max-width: 100%;
    overflow-x: hidden;
    box-sizing: border-box;
  }

  .nav-links a span {
    font-size: 0.9em;
    opacity: 0.8;
    margin-right: 4px;
  }

  .back-header {
    font-family: 'Source Code Pro', monospace;
    font-size: 1.1em;
    margin-bottom: 15px;
    color: var(--text-color);
    font-weight: normal;
    text-decoration: none;
  }

  .back-header:hover {
    color: var(--link-color-hover);
  }

  .back-header a {
    color: var(--text-color);
    text-decoration: underline;
  }

  .back-header a:hover {
    color: var(--link-color-hover);
    text-decoration: underline;
  }

  .content.post h2 {
    font-family: 'Source Code Pro', monospace;
    font-size: 1.4em;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    color: var(--text-color);
    border-bottom: none;
    font-weight: bold;
  }

  .content.post h3 {
    font-family: 'Source Code Pro', monospace;
    font-size: 1.2em;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    color: var(--text-color);
    border-bottom: none;
    font-weight: bold;
  }

  .content.post h4 {
    font-family: 'Source Code Pro', monospace;
    font-size: 1.1em;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    color: var(--text-color);
    border-bottom: none;
    font-weight: bold;
  }

  /* Ensure text after headings maintains the same font size */
  .content.post h2 + p,
  .content.post h3 + p,
  .content.post h4 + p,
  .content.post h2 + ul,
  .content.post h3 + ul,
  .content.post h4 + ul,
  .content.post h2 + ol,
  .content.post h3 + ol,
  .content.post h4 + ol {
    font-size: 1.08em;
  }

  .content.post p {
    font-size: 1.08em;
    margin-bottom: 1.5em;
    color: var(--text-color);
  }

  .content.post p.date {
    font-size: 0.9em;
    color: #666;
  }

  .content.post ul,
  .content.post ol {
    font-size: 1.01em;
    margin-top: 0.5em;
    margin-bottom: 1.5em;
    padding-left: 1.5em;
    color: var(--text-color);
  }

  .content.post li {
    font-size: 1.01em;
    margin-bottom: 0.5em;
    color: var(--text-color);
  }

  .content.post li:last-child {
    margin-bottom: 0;
  }

  .content.post code {
    background-color: var(--code-bg);
    color: var(--text-color);
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .content.post pre {
    background-color: var(--code-bg);
    color: var(--text-color);
    max-width: 100%;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .content.post blockquote {
    border-left: 4px solid var(--blockquote-border);
    padding-left: 1em;
    color: var(--blockquote-color);
  }

  .category-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
  }

  .category-chip {
    padding: 2px 8px;
    background-color: #f0f0f0;
    border-radius: 16px;
    font-size: 0.7em;
    transition: all 0.2s ease;
    user-select: none;
    color: #333;
  }
  
  .date-tag-container {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  
  .content.post p.date {
    font-size: 0.9em;
    color: #666;
    margin-bottom: 0;
  }
  
  .separator-dot {
    margin: 0 8px;
    color: #888;
  }
  
  .share-button {
    margin-left: 8px;
    background-color: #333;
    border: none;
    color: white;
    font-size: 0.8em;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 16px;
    transition: background-color 0.2s ease;
  }
  
  .share-button:hover {
    background-color: #555;
  }
  
  .share-icon {
    width: 14px;
    height: 14px;
    margin-right: 4px;
    fill: currentColor;
  }
  
  .copied-message {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #333;
    color: white;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 0.9em;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    z-index: 1000;
  }
  
  .copied-message.show {
    opacity: 1;
  }
  
  .post-title {
    border-bottom: 5px solid #f9bf3b !important;
    padding-bottom: 2px;
    display: inline-block;
    margin-top: 0.5em !important;
  }
</style>

<div class="content post">
  <h1 class="back-header"><a href="javascript:history.back()">Back</a></h1>
  <h2 class="post-title">{{ page.title }}</h2>
  <div class="date-tag-container">
    <p class="date">{{ page.date | date:"%d %B %Y" }}</p>
    {% if page.tags %}
    <span class="separator-dot">•</span>
    <div class="category-chips">
      {% for tag in page.tags %}
      <span class="category-chip">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
    <span class="separator-dot">•</span>
    <button class="share-button" id="shareButton" title="Share this post">
      <svg class="share-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
      </svg>
      Share
    </button>
  </div>
  <div class="copied-message" id="copiedMessage">URL copied to clipboard!</div>
  {{ content }}
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const shareButton = document.getElementById('shareButton');
      const copiedMessage = document.getElementById('copiedMessage');
      
      if (shareButton) {
        shareButton.addEventListener('click', function() {
          // Get current URL
          const url = window.location.href;
          
          // Use newer Clipboard API if available
          if (navigator.clipboard) {
            navigator.clipboard.writeText(url)
              .then(() => showCopiedMessage())
              .catch(err => console.error('Could not copy text: ', err));
          } else {
            // Fallback for older browsers
            const textArea = document.createElement('textarea');
            textArea.value = url;
            textArea.style.position = 'fixed';  // Avoid scrolling to bottom
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
              const successful = document.execCommand('copy');
              if (successful) {
                showCopiedMessage();
              } else {
                console.error('Fallback: Copying text failed');
              }
            } catch (err) {
              console.error('Fallback: Copying text failed', err);
            }
            
            document.body.removeChild(textArea);
          }
        });
      }
      
      function showCopiedMessage() {
        copiedMessage.classList.add('show');
        setTimeout(() => {
          copiedMessage.classList.remove('show');
        }, 2000);
      }
    });
  </script>
</div>
