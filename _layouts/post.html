<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.site_name }}</title>
    <link rel="stylesheet" href="/static/bootstrap-3.1.1.min.css" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Code+Pro:wght@400;600&display=swap" type="text/css">
    <link rel="stylesheet" href="/static/app.css" type="text/css">
    <link rel="stylesheet" href="/static/syntax.css" type="text/css">
    <link rel="stylesheet" href="/static/dark-mode.css" type="text/css">
    <link type="application/atom+xml" rel="alternate" href="{{ site.url }}/atom.xml" />
    <meta name="theme-color" content="#121212">
    <link rel="stylesheet" href="/static/gradient-bg.css" type="text/css">
    <link rel="stylesheet" href="/static/footer.css" type="text/css">
    <style type="text/css">
      :root {
        --background-color: #121212;
        --text-color: #e0e0e0;
        --sidebar-bg: #1a1a1a;
        --code-bg: #2a2a2a;
        --blockquote-color: #aaa;
        --blockquote-border: #444;
        --link-color: #90caf9;
        --link-color-hover: #bbdefb;
      }

      /* Ensure backgrounds are transparent to show gradient */
      body, .right-column, .content, .content.post {
        background-color: transparent !important;
      }

      body {
        /* background-color removed to show gradient */
        color: var(--text-color);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column; /* Make flex direction column */
      }

      .right-column {
        width: 100%;
        flex: 1;
        padding: 40px;
        /* background-color removed to allow gradient to show through */
        max-width: 960px;
        margin: 0 auto;
      }
      
      /* Ensure all main content has consistent width across the site */
      .content {
        max-width: 800px;
        margin: 0 auto;
      }
      
      .content.post {
        font-size: 16px; /* Changed from 1.08em to absolute value for better base sizing */
        line-height: 1.6;
        margin: 0 auto;
        color: var(--text-color);
        max-width: 800px;
        overflow-x: hidden;
        box-sizing: border-box;
        padding: 0;
        width: 100%;
      }

      .back-header {
        font-family: 'Source Code Pro', monospace;
        font-size: 1.1em;
        margin-bottom: 15px;
        color: var(--text-color);
        font-weight: normal;
        text-decoration: none;
      }

      .back-header:hover {
        color: var(--link-color-hover);
      }

      .back-header a {
        color: var(--text-color);
        text-decoration: underline;
      }

      .back-header a:hover {
        color: var(--link-color-hover);
        text-decoration: underline;
      }

      .content.post h2 {
        font-family: 'Source Code Pro', monospace;
        font-size: 1.4em;
        margin-top: 1.5em;
        margin-bottom: 0.8em; /* Increased bottom margin */
        color: var(--text-color);
        border-left: 4px solid #a2e02c;
        padding: 4px 0 4px 10px;
        background-color: rgba(162, 224, 44, 0.07);
        border-bottom: none;
        border-image: none;
        font-weight: bold;
        width: 100%;
        max-width: 100%;
        display: block;
      }

      .content.post h3 {
        font-family: 'Source Code Pro', monospace;
        font-size: 1.2em;
        margin-top: 1.5em;
        margin-bottom: 0.8em; /* Increased bottom margin */
        color: var(--text-color);
        border-left: 3px solid #a2e02c;
        padding: 2px 0 2px 8px;
        background-color: rgba(162, 224, 44, 0.05);
        border-bottom: none;
        border-image: none;
        font-weight: bold;
        display: block;
      }

      .content.post h4 {
        font-family: 'Source Code Pro', monospace;
        font-size: 1.1em;
        margin-top: 1.5em;
        margin-bottom: 0.8em; /* Increased bottom margin */
        color: var(--text-color);
        border-left: 2px solid #a2e02c;
        padding: 1px 0 1px 6px;
        background-color: rgba(162, 224, 44, 0.03);
        border-bottom: none;
        border-image: none;
        font-weight: bold;
        display: block;
      }

      /* Ensure text after headings maintains the same font size */
      .content.post h2 + p,
      .content.post h3 + p,
      .content.post h4 + p,
      .content.post h2 + ul,
      .content.post h3 + ul,
      .content.post h4 + ul,
      .content.post h2 + ol,
      .content.post h3 + ol,
      .content.post h4 + ol {
        font-size: 1.08em;
      }

      .content.post p {
        font-size: 1.08em;
        margin-bottom: 1.5em;
        color: var(--text-color);
        max-width: 100%;
        box-sizing: border-box;
      }

      .content.post p.date {
        font-size: 0.9em;
        color: #666;
      }

      .content.post ul,
      .content.post ol {
        font-size: 1.01em;
        margin-top: 0.5em;
        margin-bottom: 1.5em;
        padding-left: 2em; /* Increased padding to ensure list markers are visible */
        color: var(--text-color);
        max-width: 100%;
        box-sizing: border-box;
        list-style-position: outside; /* Ensure list markers are outside the text flow */
      }

      /* Fix lists that come directly after headings */
      .content.post h2 + ul,
      .content.post h2 + ol,
      .content.post h3 + ul,
      .content.post h3 + ol,
      .content.post h4 + ul,
      .content.post h4 + ol {
        padding-left: 2.5em; /* Extra padding for lists after headings */
        margin-top: 1em; /* Add a bit more margin to separate from heading */
      }

      .content.post li {
        font-size: 1.01em;
        margin-bottom: 0.5em;
        color: var(--text-color);
        padding-left: 0.25em; /* Small padding to prevent marker overlap */
      }

      .content.post li:last-child {
        margin-bottom: 0;
      }

      .content.post code {
        background-color: var(--code-bg);
        color: var(--text-color);
        word-wrap: break-word;
        white-space: pre-wrap;
      }

      .content.post pre {
        background-color: var(--code-bg);
        color: var(--text-color);
        max-width: 100%;
        overflow-x: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        width: 100%;
        box-sizing: border-box;
      }

      .content.post blockquote {
        border-left: 4px solid var(--blockquote-border);
        padding-left: 1em;
        color: var(--blockquote-color);
      }

      .category-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      
      /* Back button styles matching the next/prev navigation */
      .back-navigation {
        margin-bottom: 20px;
        width: 100%;
        padding-top: 70px;
        padding-bottom: 70px;
      }
      
      .back-button {
        display: flex;
        justify-content: center;
        align-items: center;
        width: auto;
        height: 36px;
        background-color: transparent;
        border-radius: 0;
        text-decoration: none;
        color: #a2e02c;
        font-size: 14px;
        transition: background-color 0.3s, transform 0.2s;
        border: 2px solid #a2e02c;
        line-height: 0;
        padding: 0 12px;
        font-family: 'Source Code Pro', monospace;
        gap: 6px;
        float: left;
      }
      
      .back-button:hover {
        background-color: rgba(162, 224, 44, 0.2);
        transform: translateY(-2px);
      }
      
      .back-button .nav-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        transform: translateY(-1px);
        font-size: 18px;
      }
      
      .back-button .nav-text {
        font-size: 13px;
        font-weight: 600;
      }
      
      @media (max-width: 600px) {
        .back-navigation {
          padding-top: 40px;
          padding-bottom: 40px;
        }
        
        .back-button {
          height: 32px;
          padding: 0 10px;
          font-size: 12px;
        }
        
        .back-button .nav-arrow {
          font-size: 16px;
        }
        
        .back-button .nav-text {
          font-size: 12px;
        }
      }

      .category-chip {
        padding: 2px 8px;
        background-color: #2a2a2a;
        border-radius: 0;
        font-size: 0.7em;
        transition: all 0.2s ease;
        user-select: none;
        color: #e0e0e0;
      }
      
      .date-tag-container {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }
      
      .content.post p.date {
        font-size: 0.9em;
        color: #666;
        margin-bottom: 0;
        margin-right: 10px;
      }
      
      /* Simple post title without any decorations */
      .post-title {
        border: none !important;
        border-bottom: none !important;
        border-image: none !important;
        border-left: none !important;
        background: none !important;
        display: block !important;
        margin-top: 0.5em !important;
        margin-bottom: 0.5em !important;
        padding: 0 !important;
        text-decoration: none !important;
        font-size: 2em !important;
        color: var(--text-color) !important;
      }
      
      /* Override headings styling for post title - remove all decorations */
      h2.post-title {
        border: none !important;
        border-bottom: none !important;
        border-image: none !important;
        border-left: none !important;
        background: none !important;
        padding: 0 !important;
        text-decoration: none !important;
        display: block !important;
        color: var(--text-color) !important;
        position: static !important;
      }
      
      /* Extra selector to override any ::before or ::after decorations */
      h2.post-title::before,
      h2.post-title::after,
      .post-title::before,
      .post-title::after {
        display: none !important;
        content: none !important;
      }
      
      /* Table of Contents Styles */
      .toc-container {
        margin: 1.5em 0 2em;
        background-color: rgba(42, 42, 42, 0.5);
        border-left: 3px solid #a2e02c;
        padding: 0;
        border-radius: 0;
        font-family: 'Source Code Pro', monospace;
        transition: all 0.3s ease;
      }
      
      .toc-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 15px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.95em;
      }
      
      .toc-toggle {
        background: none;
        border: none;
        color: #a2e02c;
        font-size: 1.2em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        transition: transform 0.3s ease;
      }
      
      .toc-toggle-icon {
        display: inline-block;
        transition: transform 0.3s ease;
      }
      
      .toc-toggle.active .toc-toggle-icon {
        transform: rotate(180deg);
      }
      
      .toc-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        padding: 0;
      }
      
      .toc-content.open {
        max-height: 1000px;
      }
      
      .toc-content ul {
        list-style-type: none;
        padding-left: 0;
        margin: 0;
      }
      
      .toc-content ul ul {
        padding-left: 16px;
        position: relative;
        margin-top: 6px;
      }
      
      .toc-content li {
        margin-bottom: 6px;
        font-size: 0.8em;
        line-height: 1.3;
        position: relative;
        padding-left: 12px;
      }
      
      /* Top level items should not have left padding */
      .toc-content > ul > li {
        padding-left: 0;
      }
      
      /* Fix connector positioning - continuous vertical line */
      .toc-content ul ul::before {
        content: "";
        position: absolute;
        left: 4px;
        top: -6px;
        bottom: 0;
        width: 2px;
        background-color: #a2e02c;
      }
      
      /* Make sure the horizontal lines align properly with the vertical lines */
      .toc-content li::before {
        content: "";
        position: absolute;
        left: -2px;
        top: 0.7em;
        width: 10px;
        height: 2px;
        background-color: #a2e02c;
      }
      
      /* Remove lines/indicators for top-level items */
      .toc-content > ul > li::before {
        display: none;
      }
      
      /* Connect vertical line all the way through */
      .toc-content ul ul > li:last-child::before {
        left: -2px;
        top: 0.7em;
        width: 10px;
        height: 2px;
      }
      
      .toc-content li:last-child {
        margin-bottom: 0;
      }
      
      /* Add spacing for the prefix */
      .toc-content a {
        display: inline-block;
        white-space: pre-wrap;
      }
      
      /* Adjust spacing for top-level links */
      .toc-content > ul > li > a {
        padding-left: 0;
      }
      
      .toc-content a {
        color: #a2e02c;
        text-decoration: none;
        transition: color 0.2s ease, text-decoration 0.2s ease;
        display: inline-block;
        padding: 1px 0;
        border-bottom: 1px solid transparent;
      }
      
      .toc-content a:hover {
        color: #b5eb5a;
        border-bottom: 1px solid #b5eb5a;
      }
      
      .toc-content .toc-h2 {
        font-weight: 600;
        font-size: 0.85em;
      }
      
      .toc-content .toc-h3 {
        font-weight: normal;
        font-size: 0.8em;
      }
      
      .toc-content .toc-h4 {
        font-weight: normal;
        font-size: 0.75em;
      }
      
      @media (max-width: 768px) {
        .right-column {
          padding: 20px;
        }
        
        .content {
          padding: 0;
          max-width: 100%;
          width: 100%;
        }
        
        .content.post {
          padding: 0;
          max-width: 100%;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="gradient-bg" style="z-index: -1;"></div>
    <div class="main-background" style="z-index: -2;"></div>
    <div class="right-column">
      <div class="content post" style="background-color: transparent !important;">
        <div class="back-navigation">
          <a href="/" id="back-to-home" class="back-button">
            <span class="nav-arrow">←</span>
            <span class="nav-text">Back</span>
          </a>
        </div>
        <h2 class="post-title">{{ page.title }}</h2>
        <div class="date-tag-container">
          <p class="date">{{ page.date | date:"%d %B %Y" }}</p>
          {% if page.tags %}
          <div class="category-chips">
            {% for tag in page.tags %}
            <span class="category-chip">{{ tag }}</span>
            {% endfor %}
          </div>
          {% endif %}
        </div>
        
        <!-- Table of Contents -->
        <div class="toc-container">
          <div class="toc-header">
            <span>Table of Contents</span>
            <button class="toc-toggle" aria-label="Toggle table of contents">
              <span class="toc-toggle-icon">↓</span>
            </button>
          </div>
          <div class="toc-content"></div>
        </div>
        
                {{ content }}
        
        {% include post-navigation.html %}
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Set dark theme as default
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        
        // Handle back button click to preserve scroll position
        document.getElementById('back-to-home').addEventListener('click', function(e) {
          // Save current scroll position before navigating
          localStorage.setItem('scrollPosition', window.scrollY);
        });
        
        // Generate Table of Contents
        generateTableOfContents();
        
        // Toggle TOC visibility
        const tocHeader = document.querySelector('.toc-header');
        const tocToggle = document.querySelector('.toc-toggle');
        const tocContent = document.querySelector('.toc-content');
        
        if (tocHeader && tocToggle && tocContent) {
          tocHeader.addEventListener('click', () => {
            tocContent.classList.toggle('open');
            tocToggle.classList.toggle('active');
          });
        }
      });
      
      function generateTableOfContents() {
        const postContent = document.querySelector('.content.post');
        const tocContent = document.querySelector('.toc-content');
        const tocContainer = document.querySelector('.toc-container');
        
        if (!postContent || !tocContent) return;
        
        // Get all headings in the post
        const headings = postContent.querySelectorAll('h2, h3, h4');
        
        // Filter out the post title
        const contentHeadings = Array.from(headings).filter(heading => !heading.classList.contains('post-title'));
        
        if (contentHeadings.length < 2) {
          // Hide TOC if there are fewer than 2 headings (excluding the post title)
          if (tocContainer) tocContainer.style.display = 'none';
          return;
        }
        
        // Create hierarchical TOC structure
        const tocHTML = document.createElement('ul');
        
        let currentLevel = 2;
        let container = tocHTML;
        let prevContainer = null;
        
        headings.forEach((heading, index) => {
          // Skip the post title which is h2
          if (heading.classList.contains('post-title')) return;
          
          // Add ID to the heading if it doesn't have one
          if (!heading.id) {
            heading.id = 'heading-' + index;
          }
          
          const headingLevel = parseInt(heading.tagName.substring(1));
          
          // Handle hierarchy changes
          if (headingLevel > currentLevel) {
            // Moving deeper in hierarchy
            prevContainer = container;
            const subList = document.createElement('ul');
            prevContainer.lastChild.appendChild(subList);
            container = subList;
          } else if (headingLevel < currentLevel) {
            // Moving up in hierarchy
            container = tocHTML;
            if (headingLevel === 3) {
              // If we're at h3 and were previously deeper, find the appropriate ul
              const h2Items = tocHTML.querySelectorAll(':scope > li');
              if (h2Items.length > 0) {
                const lastH2 = h2Items[h2Items.length - 1];
                const subList = lastH2.querySelector('ul');
                if (subList) {
                  container = subList;
                }
              }
            }
          }
          
          currentLevel = headingLevel;
          
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = '#' + heading.id;
          a.textContent = heading.textContent;
          a.classList.add('toc-' + heading.tagName.toLowerCase());
          li.appendChild(a);
          container.appendChild(li);
        });
        
        tocContent.appendChild(tocHTML);
        
        // TOC is collapsed by default (no need to add any classes)
      }
    </script>
    
    {% include footer.html %}
  </body>
</html>
