<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test My Knowledge — {{ site.site_name }}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐝</text></svg>">
    <link rel="stylesheet" href="/static/bootstrap-3.1.1.min.css" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" type="text/css">
    <link rel="stylesheet" href="/static/gradient-bg.css" type="text/css">
    <link rel="stylesheet" href="/static/dark-mode.css" type="text/css">
    <link rel="stylesheet" href="/static/footer.css" type="text/css">
    <meta name="theme-color" content="#111827">
    <style type="text/css">
      :root {
        --bg: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --card-bg: #1e293b;
        --card-border: rgba(255,255,255,0.06);
        --accent: #60a5fa;
        --accent-hover: #93c5fd;
        --green: #34d399;
        --green-bg: rgba(52,211,153,0.12);
        --red: #f87171;
        --red-bg: rgba(248,113,113,0.12);
        --yellow: #fbbf24;
        --yellow-bg: rgba(251,191,36,0.12);
        --code-bg: #0f172a;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .quiz-container {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 20px;
        width: 100%;
        flex: 1;
      }

      /* ── Start Screen ── */
      .start-screen {
        text-align: center;
        padding: 60px 0;
      }

      .start-screen h1 {
        font-size: 2.4rem;
        font-weight: 800;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #60a5fa, #34d399);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .start-screen p {
        color: var(--muted);
        font-size: 1.1rem;
        margin-bottom: 40px;
        line-height: 1.6;
      }

      .difficulty-label {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 16px;
      }

      .difficulty-options {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 40px;
        flex-wrap: wrap;
      }

      .diff-btn {
        padding: 14px 32px;
        border: 2px solid var(--card-border);
        border-radius: 12px;
        background: var(--card-bg);
        color: var(--text);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }

      .diff-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
      .diff-btn.selected { border-color: var(--accent); background: rgba(96,165,250,0.15); }

      .diff-btn .diff-icon { font-size: 1.5rem; display: block; margin-bottom: 4px; }

      .start-btn {
        padding: 16px 48px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: #fff;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        opacity: 0.5;
        pointer-events: none;
      }

      .start-btn.active { opacity: 1; pointer-events: auto; }
      .start-btn.active:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59,130,246,0.3); }

      /* ── Progress Bar ── */
      .progress-section {
        margin-bottom: 24px;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .progress-bar-bg {
        height: 6px;
        background: rgba(255,255,255,0.06);
        border-radius: 3px;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #3b82f6, #34d399);
        border-radius: 3px;
        transition: width 0.4s ease;
      }

      .score-chips {
        display: flex;
        gap: 16px;
        margin-top: 10px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .chip-correct { color: var(--green); }
      .chip-wrong { color: var(--red); }

      /* ── Question Card ── */
      .question-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 32px;
        position: relative;
        overflow: hidden;
        animation: cardIn 0.35s ease;
      }

      @keyframes cardIn {
        from { opacity: 0; transform: translateX(30px); }
        to { opacity: 1; transform: translateX(0); }
      }

      .q-topic {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        background: rgba(96,165,250,0.12);
        color: var(--accent);
        margin-bottom: 16px;
      }

      .q-difficulty {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 600;
        margin-left: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .q-difficulty.easy { background: var(--green-bg); color: var(--green); }
      .q-difficulty.medium { background: var(--yellow-bg); color: var(--yellow); }
      .q-difficulty.hard { background: var(--red-bg); color: var(--red); }

      .q-type-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 600;
        margin-left: 8px;
        background: rgba(139,92,246,0.12);
        color: #a78bfa;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .q-text {
        font-size: 1.15rem;
        font-weight: 600;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .q-code {
        background: var(--code-bg);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 10px;
        padding: 16px 20px;
        margin-bottom: 20px;
        overflow-x: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
        line-height: 1.7;
        color: #e2e8f0;
        white-space: pre;
      }

      /* ── MCQ Options ── */
      .options-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .option-btn {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 18px;
        border: 1.5px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.15s;
        text-align: left;
        font-family: inherit;
        line-height: 1.5;
        width: 100%;
      }

      .option-btn:hover:not(.disabled) { border-color: var(--accent); background: rgba(96,165,250,0.06); }

      .option-letter {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: rgba(255,255,255,0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .option-btn.correct {
        border-color: var(--green);
        background: var(--green-bg);
      }
      .option-btn.correct .option-letter {
        background: var(--green);
        color: #111827;
      }

      .option-btn.wrong {
        border-color: var(--red);
        background: var(--red-bg);
      }
      .option-btn.wrong .option-letter {
        background: var(--red);
        color: #111827;
      }

      .option-btn.disabled { cursor: default; opacity: 0.6; }
      .option-btn.correct.disabled, .option-btn.wrong.disabled { opacity: 1; }

      /* ── Open Question ── */
      .reveal-btn {
        padding: 14px 28px;
        border: 2px dashed rgba(255,255,255,0.15);
        border-radius: 12px;
        background: transparent;
        color: var(--accent);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        width: 100%;
      }

      .reveal-btn:hover { border-color: var(--accent); background: rgba(96,165,250,0.06); }

      .answer-reveal {
        padding: 20px;
        border-radius: 12px;
        background: rgba(52,211,153,0.06);
        border: 1px solid rgba(52,211,153,0.2);
        margin-top: 16px;
        line-height: 1.7;
        font-size: 0.95rem;
        animation: revealIn 0.3s ease;
      }

      .answer-reveal .reveal-label {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--green);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }

      @keyframes revealIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .self-rate {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      .rate-btn {
        flex: 1;
        padding: 12px;
        border: 1.5px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
      }

      .rate-btn:hover { transform: translateY(-1px); }
      .rate-btn.knew-it:hover { border-color: var(--green); background: var(--green-bg); }
      .rate-btn.didnt-know:hover { border-color: var(--red); background: var(--red-bg); }

      /* ── Explanation ── */
      .explanation-box {
        margin-top: 16px;
        padding: 16px 20px;
        border-radius: 10px;
        background: rgba(96,165,250,0.06);
        border-left: 3px solid var(--accent);
        font-size: 0.9rem;
        line-height: 1.6;
        color: var(--muted);
        animation: revealIn 0.3s ease;
      }

      .explanation-box strong {
        color: var(--accent);
        font-weight: 600;
      }

      /* ── Next Button ── */
      .next-btn {
        margin-top: 24px;
        padding: 14px 32px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        float: right;
      }

      .next-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(59,130,246,0.3); }

      /* ── Results Screen ── */
      .results-screen {
        text-align: center;
        padding: 40px 0;
      }

      .results-circle {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        margin: 0 auto 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 4px solid;
        position: relative;
      }

      .results-circle.grade-a { border-color: var(--green); background: var(--green-bg); }
      .results-circle.grade-b { border-color: var(--accent); background: rgba(96,165,250,0.08); }
      .results-circle.grade-c { border-color: var(--yellow); background: var(--yellow-bg); }
      .results-circle.grade-d { border-color: var(--red); background: var(--red-bg); }

      .results-score {
        font-size: 3rem;
        font-weight: 800;
      }

      .results-label {
        font-size: 0.9rem;
        color: var(--muted);
        margin-top: 2px;
      }

      .results-grade {
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .results-message {
        font-size: 1rem;
        color: var(--muted);
        margin-bottom: 32px;
        line-height: 1.5;
      }

      .results-stats {
        display: flex;
        gap: 24px;
        justify-content: center;
        margin-bottom: 40px;
        flex-wrap: wrap;
      }

      .stat-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 20px 28px;
        min-width: 120px;
      }

      .stat-value {
        font-size: 1.8rem;
        font-weight: 800;
      }

      .stat-label {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 4px;
      }

      .restart-btn {
        padding: 16px 48px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: #fff;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }

      .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59,130,246,0.3); }

      /* ── Animations ── */
      @keyframes correctPulse {
        0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.4); }
        70% { box-shadow: 0 0 0 12px rgba(52,211,153,0); }
        100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
      }

      @keyframes wrongShake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
      }

      .card-correct { animation: correctPulse 0.5s ease; }
      .card-wrong { animation: wrongShake 0.4s ease; }

      @keyframes confetti {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(-60px) rotate(720deg); opacity: 0; }
      }

      .confetti-piece {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        animation: confetti 0.8s ease forwards;
      }

      /* ── Responsive ── */
      @media (max-width: 600px) {
        .quiz-container { padding: 24px 16px; }
        .start-screen h1 { font-size: 1.8rem; }
        .question-card { padding: 24px 20px; }
        .q-text { font-size: 1.05rem; }
        .difficulty-options { flex-direction: column; align-items: center; }
        .diff-btn { width: 100%; max-width: 240px; }
        .results-stats { flex-direction: column; align-items: center; }
        .self-rate { flex-direction: column; }
      }

      /* ── Back link ── */
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
        margin-bottom: 24px;
        transition: color 0.2s;
      }
      .back-link:hover { color: var(--accent); }

      .hidden { display: none !important; }

      /* clearfix */
      .clearfix::after { content: ''; display: table; clear: both; }
    </style>
  </head>
  <body>
    <div class="quiz-container">
      <a href="/resources/" class="back-link">← Back to Resources</a>

      <!-- ── Start Screen ── -->
      <div id="start-screen" class="start-screen">
        <h1>🧠 Test My Knowledge</h1>
        <p>100 questions from Android, Kotlin, Compose, Coroutines, Architecture and more.<br>Pick a difficulty and challenge yourself.</p>

        <div class="difficulty-label">Select Difficulty</div>
        <div class="difficulty-options">
          <button class="diff-btn" data-diff="easy" onclick="selectDifficulty('easy')">
            <span class="diff-icon">🟢</span> Easy
          </button>
          <button class="diff-btn" data-diff="medium" onclick="selectDifficulty('medium')">
            <span class="diff-icon">🟡</span> Medium
          </button>
          <button class="diff-btn" data-diff="hard" onclick="selectDifficulty('hard')">
            <span class="diff-icon">🔴</span> Hard
          </button>
          <button class="diff-btn" data-diff="all" onclick="selectDifficulty('all')">
            <span class="diff-icon">🎯</span> All Levels
          </button>
        </div>

        <button class="start-btn" id="start-btn" onclick="startQuiz()">Start Quiz →</button>
      </div>

      <!-- ── Quiz Screen ── -->
      <div id="quiz-screen" class="hidden">
        <div class="progress-section">
          <div class="progress-header">
            <span id="q-counter">Question 1 of 100</span>
            <span id="q-score">Score: 0</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
          </div>
          <div class="score-chips">
            <span class="chip-correct">✓ <span id="correct-count">0</span></span>
            <span class="chip-wrong">✗ <span id="wrong-count">0</span></span>
          </div>
        </div>

        <div id="question-area"></div>

        <div class="clearfix">
          <button class="next-btn hidden" id="next-btn" onclick="nextQuestion()">Next →</button>
        </div>
      </div>

      <!-- ── Results Screen ── -->
      <div id="results-screen" class="results-screen hidden"></div>
    </div>

    <script>
      let allQuestions = [];
      let quizQuestions = [];
      let currentIndex = 0;
      let correct = 0;
      let wrong = 0;
      let selectedDifficulty = null;
      let answered = false;
      const QUIZ_SIZE = 100;

      // Load questions
      fetch('/static/quiz-questions.json')
        .then(r => r.json())
        .then(data => { allQuestions = data; })
        .catch(e => console.error('Failed to load questions:', e));

      function selectDifficulty(diff) {
        selectedDifficulty = diff;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
        document.querySelector(`.diff-btn[data-diff="${diff}"]`).classList.add('selected');
        document.getElementById('start-btn').classList.add('active');
      }

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function startQuiz() {
        if (!selectedDifficulty) return;

        let pool = allQuestions;
        if (selectedDifficulty !== 'all') {
          pool = allQuestions.filter(q => q.difficulty === selectedDifficulty);
        }

        // Shuffle and pick up to QUIZ_SIZE
        quizQuestions = shuffle(pool).slice(0, QUIZ_SIZE);

        // Sort by difficulty: easy → medium → hard
        const diffOrder = { easy: 0, medium: 1, hard: 2 };
        quizQuestions.sort((a, b) => (diffOrder[a.difficulty] || 0) - (diffOrder[b.difficulty] || 0));

        currentIndex = 0;
        correct = 0;
        wrong = 0;
        answered = false;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('results-screen').classList.add('hidden');

        renderQuestion();
      }

      function renderQuestion() {
        answered = false;
        const q = quizQuestions[currentIndex];
        const total = quizQuestions.length;

        document.getElementById('q-counter').textContent = `Question ${currentIndex + 1} of ${total}`;
        document.getElementById('q-score').textContent = `Score: ${correct}/${currentIndex}`;
        document.getElementById('correct-count').textContent = correct;
        document.getElementById('wrong-count').textContent = wrong;
        document.getElementById('progress-fill').style.width = `${(currentIndex / total) * 100}%`;
        document.getElementById('next-btn').classList.add('hidden');

        const area = document.getElementById('question-area');
        const letters = ['A', 'B', 'C', 'D'];

        let typeLabel = q.type === 'mcq' ? 'Multiple Choice' : 'Flashcard';
        let codeBlock = q.code ? `<pre class="q-code">${escapeHtml(q.code)}</pre>` : '';

        let questionText = q.q;
        // If question contains code block in markdown, extract it
        const codeMatch = questionText.match(/```(\w*)\n([\s\S]*?)```/);
        if (codeMatch && !q.code) {
          codeBlock = `<pre class="q-code">${escapeHtml(codeMatch[2].trim())}</pre>`;
          questionText = questionText.replace(/\n?```(\w*)\n[\s\S]*?```/, '').trim();
        }

        let html = `
          <div class="question-card" id="q-card">
            <span class="q-topic">${q.topic}</span>
            <span class="q-difficulty ${q.difficulty}">${q.difficulty}</span>
            <span class="q-type-badge">${typeLabel}</span>
            <div class="q-text">${escapeHtml(questionText)}</div>
            ${codeBlock}
        `;

        if (q.type === 'mcq') {
          html += '<div class="options-list">';
          q.options.forEach((opt, i) => {
            html += `
              <button class="option-btn" data-index="${i}" onclick="selectOption(${i})">
                <span class="option-letter">${letters[i]}</span>
                <span>${escapeHtml(opt)}</span>
              </button>`;
          });
          html += '</div>';
        } else {
          // Open/flashcard type
          html += `
            <button class="reveal-btn" id="reveal-btn" onclick="revealAnswer()">
              👆 Tap to Reveal Answer
            </button>
            <div class="answer-reveal hidden" id="answer-reveal">
              <div class="reveal-label">Answer</div>
              <div>${escapeHtml(q.answer)}</div>
            </div>
            <div class="self-rate hidden" id="self-rate">
              <button class="rate-btn knew-it" onclick="selfRate(true)">✓ I Knew It</button>
              <button class="rate-btn didnt-know" onclick="selfRate(false)">✗ Didn't Know</button>
            </div>
          `;
        }

        html += '</div>';
        area.innerHTML = html;
      }

      function selectOption(idx) {
        if (answered) return;
        answered = true;

        const q = quizQuestions[currentIndex];
        const btns = document.querySelectorAll('.option-btn');
        const card = document.getElementById('q-card');

        btns.forEach(b => b.classList.add('disabled'));

        // Show correct answer
        btns[q.answer].classList.add('correct');

        if (idx === q.answer) {
          correct++;
          card.classList.add('card-correct');
          spawnConfetti(card);
        } else {
          wrong++;
          btns[idx].classList.add('wrong');
          card.classList.add('card-wrong');
        }

        // Show explanation
        if (q.explanation) {
          const expl = document.createElement('div');
          expl.className = 'explanation-box';
          expl.innerHTML = `<strong>💡 Explanation:</strong> ${escapeHtml(q.explanation)}`;
          document.querySelector('.question-card').appendChild(expl);
        }

        document.getElementById('q-score').textContent = `Score: ${correct}/${currentIndex + 1}`;
        document.getElementById('correct-count').textContent = correct;
        document.getElementById('wrong-count').textContent = wrong;

        showNextBtn();
      }

      function revealAnswer() {
        document.getElementById('reveal-btn').classList.add('hidden');
        document.getElementById('answer-reveal').classList.remove('hidden');
        document.getElementById('self-rate').classList.remove('hidden');
      }

      function selfRate(knew) {
        if (answered) return;
        answered = true;

        if (knew) {
          correct++;
          spawnConfetti(document.getElementById('q-card'));
        } else {
          wrong++;
        }

        document.querySelectorAll('.rate-btn').forEach(b => b.style.pointerEvents = 'none');

        const q = quizQuestions[currentIndex];
        if (q.explanation) {
          const expl = document.createElement('div');
          expl.className = 'explanation-box';
          expl.innerHTML = `<strong>💡 Explanation:</strong> ${escapeHtml(q.explanation)}`;
          document.querySelector('.question-card').appendChild(expl);
        }

        document.getElementById('q-score').textContent = `Score: ${correct}/${currentIndex + 1}`;
        document.getElementById('correct-count').textContent = correct;
        document.getElementById('wrong-count').textContent = wrong;

        showNextBtn();
      }

      function showNextBtn() {
        const btn = document.getElementById('next-btn');
        if (currentIndex < quizQuestions.length - 1) {
          btn.textContent = 'Next →';
        } else {
          btn.textContent = 'See Results';
        }
        btn.classList.remove('hidden');
      }

      function nextQuestion() {
        currentIndex++;
        if (currentIndex >= quizQuestions.length) {
          showResults();
        } else {
          renderQuestion();
        }
      }

      function showResults() {
        document.getElementById('quiz-screen').classList.add('hidden');
        const total = quizQuestions.length;
        const pct = Math.round((correct / total) * 100);

        let grade, gradeClass, message;
        if (pct >= 90) {
          grade = '🏆 Outstanding!';
          gradeClass = 'grade-a';
          message = 'You truly know your Android engineering. Keep pushing the boundaries.';
        } else if (pct >= 70) {
          grade = '🌟 Great Job!';
          gradeClass = 'grade-b';
          message = 'Solid knowledge. Review the topics you missed to level up further.';
        } else if (pct >= 50) {
          grade = '📚 Keep Learning!';
          gradeClass = 'grade-c';
          message = 'Good foundation. Dive deeper into the topics where you struggled.';
        } else {
          grade = '💪 Don\'t Give Up!';
          gradeClass = 'grade-d';
          message = 'Every expert was once a beginner. Keep studying and try again.';
        }

        const resultsDiv = document.getElementById('results-screen');
        resultsDiv.innerHTML = `
          <div class="results-circle ${gradeClass}">
            <div class="results-score">${pct}%</div>
            <div class="results-label">${correct} of ${total}</div>
          </div>
          <div class="results-grade">${grade}</div>
          <p class="results-message">${message}</p>
          <div class="results-stats">
            <div class="stat-card">
              <div class="stat-value" style="color:var(--green)">${correct}</div>
              <div class="stat-label">Correct</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" style="color:var(--red)">${wrong}</div>
              <div class="stat-label">Wrong</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" style="color:var(--accent)">${total}</div>
              <div class="stat-label">Total</div>
            </div>
          </div>
          <button class="restart-btn" onclick="restart()">Try Again</button>
        `;
        resultsDiv.classList.remove('hidden');
      }

      function restart() {
        document.getElementById('results-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        selectedDifficulty = null;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('start-btn').classList.remove('active');
      }

      function spawnConfetti(parent) {
        const colors = ['#34d399', '#60a5fa', '#fbbf24', '#a78bfa', '#f87171'];
        for (let i = 0; i < 12; i++) {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.background = colors[Math.floor(Math.random() * colors.length)];
          piece.style.left = Math.random() * 100 + '%';
          piece.style.top = Math.random() * 60 + '%';
          piece.style.animationDelay = Math.random() * 0.3 + 's';
          parent.appendChild(piece);
          setTimeout(() => piece.remove(), 1200);
        }
      }

      function escapeHtml(str) {
        if (typeof str !== 'string') return str;
        const div = document.createElement('div');
        div.textContent = str;
        let result = div.innerHTML;
        // Preserve backtick code in answers
        result = result.replace(/`([^`]+)`/g, '<code style="background:rgba(96,165,250,0.12);padding:2px 6px;border-radius:4px;font-family:JetBrains Mono,monospace;font-size:0.85em">$1</code>');
        return result;
      }
    </script>

    {% include footer.html %}
  </body>
</html>
