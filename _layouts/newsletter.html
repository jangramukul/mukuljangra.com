<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.site_name }}</title>
  <link rel="icon" type="image/jpeg" href="/static/profile.jpg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/syntax.css">
  <link type="application/atom+xml" rel="alternate" href="{{ site.url }}/newsletter.xml" title="Weekly Newsletter" />
  <meta name="theme-color" content="#1c1c1e">
  <style>
    html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    #read-progress {
      position: fixed; top: 0; left: 0;
      height: 2px; width: 0%;
      background: #1a1a1a;
      z-index: 9999;
      transition: width 0.08s linear;
    }

    .shell { display: flex; min-height: 100vh; }

    .sidebar {
      width: 240px; min-width: 240px;
      background: #1c1c1e; color: #e8e8e8;
      display: flex; flex-direction: column;
      padding: 32px 24px;
      position: fixed; top: 0; left: 0; bottom: 0;
      overflow-y: auto; z-index: 10;
    }

    .sidebar-name { font-size: 0.9em; font-weight: 600; color: #fff; margin-bottom: 20px; }
    .sidebar-name a { color: #fff; text-decoration: none; }
    .sidebar-name a:hover { text-decoration: underline; }

    .sidebar-nav { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .sidebar-nav li a { font-size: 0.82em; color: #636366; padding: 6px 0; display: block; text-decoration: none; transition: color 0.15s; }
    .sidebar-nav li a:hover { color: #e8e8e8; text-decoration: none; }

    .main { margin-left: 240px; flex: 1; background: #ffffff; }

    .nl-wrap {
      max-width: 680px;
      padding: 64px 56px 80px;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.8em; color: #aaa; text-decoration: none;
      margin-bottom: 36px; transition: color 0.15s;
    }

    .back-link:hover { color: #1a1a1a; text-decoration: none; }

    .nl-label { font-size: 0.75em; color: #aaa; margin-bottom: 10px; }

    .nl-title {
      font-size: 1.6em; font-weight: 600;
      color: #1a1a1a; line-height: 1.25;
      margin-bottom: 12px;
    }

    .nl-meta {
      font-size: 0.8em; color: #aaa;
      margin-bottom: 32px;
      display: flex; align-items: center; gap: 12px;
    }

    .nl-rss { color: #aaa; text-decoration: none; font-size: 0.9em; display: flex; align-items: center; gap: 4px; }
    .nl-rss:hover { color: #1a1a1a; text-decoration: none; }

    .nl-divider { border-top: 1px solid #ebebeb; margin-bottom: 36px; }

    .nl-body {
      font-size: 1rem; line-height: 1.8; color: #333;
    }

    .nl-body h1, .nl-body h2 { font-size: 1.1em; font-weight: 600; color: #1a1a1a; margin: 2em 0 0.7em; }
    .nl-body h3 { font-size: 1em; font-weight: 600; color: #333; margin: 1.6em 0 0.6em; }
    .nl-body p { margin-bottom: 1.3em; }
    .nl-body a { color: #1a1a1a; text-decoration: underline; text-underline-offset: 2px; }
    .nl-body a:hover { color: #555; }
    .nl-body ul, .nl-body ol { padding-left: 1.6em; margin-bottom: 1.3em; }
    .nl-body li { margin-bottom: 0.4em; }
    .nl-body code { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 0.875em; background: #f4f4f4; padding: 2px 5px; border-radius: 3px; }
    .nl-body pre { background: #f6f6f6; border: 1px solid #e8e8e8; padding: 18px 20px; overflow-x: auto; border-radius: 4px; margin-bottom: 1.3em; }
    .nl-body pre code { background: none; padding: 0; }
    .nl-body .highlight { margin-bottom: 1.3em; border: 1px solid #e8e8e8; border-radius: 4px; overflow: hidden; }
    .nl-body .highlight pre { margin: 0; border: none; border-radius: 0; }
    .nl-body blockquote { border-left: 3px solid #ddd; padding: 4px 0 4px 18px; color: #666; margin: 1.3em 0; font-style: italic; }
    .nl-body blockquote p { margin: 0; }
    .nl-body hr { border: none; border-top: 1px solid #ebebeb; margin: 2em 0; }
    .nl-body strong { color: #1a1a1a; }

    .nl-footer {
      margin-top: 60px; padding-top: 20px;
      border-top: 1px solid #ebebeb;
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px;
    }

    .back-link-footer { font-size: 0.82em; color: #aaa; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: color 0.15s; }
    .back-link-footer:hover { color: #1a1a1a; text-decoration: none; }

    @media (max-width: 720px) {
      .shell { flex-direction: column; }
      .sidebar { position: static; width: 100%; min-width: 0; padding: 20px 24px; }
      .main { margin-left: 0; }
      .nl-wrap { padding: 32px 24px 60px; }
      .nl-title { font-size: 1.3em; }
    }
  </style>
</head>
<body>
<div id="read-progress"></div>
<div class="shell">

  <aside class="sidebar">
    <div class="sidebar-name"><a href="/">Mukul Jangra</a></div>
    <ul class="sidebar-nav">
      <li><a href="/#experience">Experience</a></li>
      <li><a href="/#open-source">Open Source</a></li>
      <li><a href="/#writing">Writing</a></li>
      <li><a href="/#newsletter">Newsletter</a></li>
    </ul>
  </aside>

  <main class="main">
    <div class="nl-wrap">
      <a href="javascript:history.length>1?history.back():window.location='/'" class="back-link">← Newsletter</a>

      <div class="nl-label">Weekly Newsletter</div>
      <h1 class="nl-title">{{ page.title }}</h1>
      <div class="nl-meta">
        <span>{{ page.date | date: "%A, %B %d, %Y" }}</span>
        <span>·</span>
        <a href="{{ site.url }}/newsletter.xml" class="nl-rss" rel="noopener" target="_blank">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><circle cx="3.429" cy="20.571" r="3.429"/><path d="M11.429 24h4.57C15.999 15.179 8.821 8.001 0 8.001v4.572c6.302 0 11.429 5.126 11.429 11.427z"/><path d="M24 24C24 10.766 13.234 0 0 0v4.571c10.714 0 19.429 8.714 19.429 19.429z"/></svg>
          Subscribe via RSS
        </a>
      </div>

      <div class="nl-divider"></div>

      <div class="nl-body">
        {{ content }}
      </div>

      <div class="nl-footer">
        <a href="javascript:history.length>1?history.back():window.location='/'" class="back-link-footer">← All issues</a>
      </div>
    </div>
  </main>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var bar = document.getElementById('read-progress');
  window.addEventListener('scroll', function() {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? Math.min(100, window.scrollY / h * 100) : 0) + '%';
  }, { passive: true });
});
</script>
</body>
</html>
