<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.site_name }}</title>
    <link rel="icon" type="image/svg+xml" href="/static/space-favicon.svg">
    <link rel="stylesheet" href="/static/bootstrap-3.1.1.min.css" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" type="text/css">
    <link rel="stylesheet" href="/static/gradient-bg.css" type="text/css">
    <link rel="stylesheet" href="/static/nav.css" type="text/css">
    <link rel="stylesheet" href="/static/syntax.css" type="text/css">
    <link rel="stylesheet" href="/static/dark-mode.css" type="text/css">
    <link rel="stylesheet" href="/static/footer.css" type="text/css">
    <link type="application/atom+xml" rel="alternate" href="{{ site.url }}/newsletter.xml" title="Weekly Newsletter" />
    <meta name="theme-color" content="#000000">
    <style type="text/css">
      :root {
        --link-color: #00E5D0;
        --link-color-hover: #7ffff4;
        --accent: #00E5D0;
      }

      body {
        background-color: #000000;
        color: #e5e7eb;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Reading progress */
      #read-progress {
        position: fixed;
        top: 0; left: 0;
        height: 2px;
        width: 0%;
        background: #00E5D0;
        z-index: 9999;
        box-shadow: 0 0 8px rgba(0, 229, 208, 0.5);
        transition: width 0.1s linear;
      }

      .right-column {
        width: 100%;
        flex: 1;
        padding: 0 40px 80px;
        max-width: 1200px;
        margin: 0 auto;
        box-sizing: border-box;
      }

      /* Newsletter header */
      .nl-header {
        max-width: 720px;
        margin: 0 auto;
        padding-top: 110px;
        padding-bottom: 48px;
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #4b5563;
        font-family: 'Space Mono', monospace;
        font-size: 0.68em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-decoration: none;
        transition: all 0.2s ease;
        margin-bottom: 40px;
      }

      .back-button:hover {
        color: #00E5D0;
        border-color: rgba(0, 229, 208, 0.35);
        background: rgba(0, 229, 208, 0.04);
        text-decoration: none;
      }

      .nl-eyebrow {
        font-family: 'Space Mono', monospace;
        font-size: 0.72em;
        color: #00E5D0;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      .nl-title {
        font-family: 'Space Mono', 'Courier New', monospace;
        font-size: 1.9em;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.2;
        letter-spacing: 0.02em;
        margin: 0 0 24px 0;
      }

      .nl-meta {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .nl-date {
        font-family: 'Space Mono', monospace;
        font-size: 0.72em;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .meta-dot { color: #1f2937; font-size: 0.55em; }

      .nl-rss-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: 'Space Mono', monospace;
        font-size: 0.68em;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        text-decoration: none;
        transition: color 0.2s;
      }

      .nl-rss-link:hover { color: #00E5D0; text-decoration: none; }

      /* Divider */
      .nl-divider {
        max-width: 720px;
        margin: 0 auto 48px;
        height: 1px;
        background: rgba(0, 229, 208, 0.1);
      }

      /* Newsletter body */
      .nl-body {
        max-width: 720px;
        margin: 0 auto;
        font-size: 17px;
        line-height: 1.85;
        color: #9ca3af;
      }

      .nl-body h1, .nl-body h2 {
        font-family: 'Space Mono', monospace;
        font-size: 1.1em;
        font-weight: 700;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border-left: 2px solid #00E5D0;
        padding: 4px 0 4px 14px;
        margin: 2em 0 0.9em;
      }

      .nl-body h3 {
        font-family: 'Space Mono', monospace;
        font-size: 0.95em;
        font-weight: 700;
        color: #d1d5db;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-left: 2px solid rgba(0, 229, 208, 0.35);
        padding: 3px 0 3px 12px;
        margin: 1.6em 0 0.8em;
      }

      .nl-body p { margin-bottom: 1.3em; color: #9ca3af; }

      .nl-body a {
        color: #00E5D0;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .nl-body a:hover { color: #7ffff4; }

      .nl-body ul, .nl-body ol {
        padding-left: 1.6em;
        margin-bottom: 1.3em;
        color: #9ca3af;
      }

      .nl-body li { margin-bottom: 0.55em; line-height: 1.75; }

      .nl-body code {
        background: #0d0d0d;
        color: #00E5D0;
        padding: 2px 6px;
        font-family: 'Space Mono', monospace;
        font-size: 0.84em;
        border: 1px solid rgba(0, 229, 208, 0.12);
        border-radius: 0;
      }

      .nl-body pre {
        background: #0d0d0d;
        border: 1px solid rgba(0, 229, 208, 0.1);
        padding: 20px 24px;
        overflow-x: auto;
        margin: 0 0 1.3em;
        border-radius: 0;
      }

      .nl-body pre code { background: transparent; border: none; color: #e5e7eb; padding: 0; word-break: normal; }

      .nl-body .highlight { margin-bottom: 1.3em; border: 1px solid rgba(0, 229, 208, 0.1); overflow: hidden; }
      .nl-body .highlight pre { margin: 0; border: none; }

      .nl-body blockquote {
        border-left: 2px solid rgba(0, 229, 208, 0.5);
        padding: 10px 18px;
        margin: 1.3em 0;
        background: rgba(0, 229, 208, 0.03);
        color: #6b7280;
        font-style: italic;
      }

      .nl-body blockquote p { margin-bottom: 0; color: inherit; }

      .nl-body hr { border: none; border-top: 1px solid rgba(0, 229, 208, 0.08); margin: 2.2em 0; }
      .nl-body strong { color: #e5e7eb; font-weight: 600; }
      .nl-body img { max-width: 100%; display: block; margin: 1.5em auto; border: 1px solid rgba(255,255,255,0.06); }

      /* Footer nav */
      .nl-footer {
        max-width: 720px;
        margin: 64px auto 0;
        padding-top: 24px;
        border-top: 1px solid rgba(0, 229, 208, 0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .nl-footer-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #4b5563;
        font-family: 'Space Mono', monospace;
        font-size: 0.68em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .nl-footer-back:hover {
        color: #00E5D0;
        border-color: rgba(0, 229, 208, 0.35);
        background: rgba(0, 229, 208, 0.04);
        text-decoration: none;
      }

      .nl-subscribe-cta {
        font-family: 'Space Mono', monospace;
        font-size: 0.68em;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .nl-subscribe-cta a { color: #00E5D0; text-decoration: none; }
      .nl-subscribe-cta a:hover { color: #7ffff4; }

      @media (max-width: 768px) {
        .right-column { padding: 0 20px 60px; }
        .nl-header { padding-top: 80px; padding-bottom: 32px; }
        .nl-title { font-size: 1.4em; }
        .nl-body { font-size: 15px; }
        .nl-footer { flex-direction: column; align-items: flex-start; gap: 12px; margin-top: 48px; }
      }
    </style>
  </head>
  <body>
    <div id="read-progress"></div>
    {% include site-nav.html %}
    <div class="gradient-bg"></div>
    <div class="main-background"></div>

    <div class="right-column">

      <div class="nl-header">
        <a href="javascript:history.length>1?history.back():window.location='/'" class="back-button">
          ← Back
        </a>

        <div class="nl-eyebrow">// Weekly Newsletter</div>
        <h1 class="nl-title">{{ page.title }}</h1>

        <div class="nl-meta">
          <span class="nl-date">{{ page.date | date: "%A, %B %d, %Y" }}</span>
          <span class="meta-dot">◆</span>
          <a href="{{ site.url }}/newsletter.xml" class="nl-rss-link" rel="noopener" target="_blank">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><circle cx="3.429" cy="20.571" r="3.429"/><path d="M11.429 24h4.57C15.999 15.179 8.821 8.001 0 8.001v4.572c6.302 0 11.429 5.126 11.429 11.427z"/><path d="M24 24C24 10.766 13.234 0 0 0v4.571c10.714 0 19.429 8.714 19.429 19.429z"/></svg>
            Subscribe via RSS
          </a>
        </div>
      </div>

      <div class="nl-divider"></div>

      <div class="nl-body" id="nl-content">
        {{ content }}
      </div>

      <div class="nl-footer">
        <a href="javascript:history.length>1?history.back():window.location='/'" class="nl-footer-back">
          ← All Issues
        </a>
        <div class="nl-subscribe-cta">
          <a href="{{ site.url }}/newsletter.xml">Subscribe via RSS</a>
        </div>
      </div>

    </div>

    {% include footer.html %}

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        document.documentElement.setAttribute('data-theme', 'dark');
        var bar = document.getElementById('read-progress');
        window.addEventListener('scroll', function() {
          var scrollTop = window.scrollY || document.documentElement.scrollTop;
          var docHeight = document.documentElement.scrollHeight - window.innerHeight;
          bar.style.width = (docHeight > 0 ? Math.min(100, (scrollTop / docHeight) * 100) : 0) + '%';
        }, { passive: true });
      });
    </script>
  </body>
</html>
