<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.site_name }}</title>
  <link rel="icon" type="image/jpeg" href="/static/profile.jpg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/sidebar.css">
  <link rel="stylesheet" href="/static/syntax.css">
  <link type="application/atom+xml" rel="alternate" href="{{ site.url }}/newsletter.xml" title="Weekly Newsletter" />
  <meta name="theme-color" content="#1c1c1e">
  <style>
    html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    #read-progress {
      position: fixed; top: 0; left: 0;
      height: 2px; width: 0%;
      background: #1a1a1a;
      z-index: 9999;
      transition: width 0.08s linear;
    }

    .shell { display: flex; min-height: 100vh; overflow-x: hidden; }

    .main { margin-left: 380px; flex: 1; background: #ffffff; min-width: 0; overflow-x: hidden; }

    .nl-wrap {
      width: 70%;
      padding: 60px 0 80px 56px;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.8em; color: #aaa; text-decoration: none;
      margin-bottom: 36px; transition: color 0.15s;
    }

    .back-link:hover { color: #1a1a1a; text-decoration: none; }

    .nl-label { font-size: 0.75em; color: #aaa; margin-bottom: 10px; }

    .nl-title {
      font-size: 1.6em; font-weight: 600;
      color: #1a1a1a; line-height: 1.25;
      margin-bottom: 12px;
    }

    .nl-meta {
      font-size: 0.8em; color: #aaa;
      margin-bottom: 32px;
      display: flex; align-items: center; gap: 12px;
    }

    .nl-rss { color: #aaa; text-decoration: none; font-size: 0.9em; display: flex; align-items: center; gap: 4px; }
    .nl-rss:hover { color: #1a1a1a; text-decoration: none; }

    .nl-divider { border-top: 1px solid #ebebeb; margin-bottom: 36px; }

    .nl-body {
      font-size: 1.0625rem; line-height: 1.85; color: #333;
      overflow-wrap: break-word; word-break: break-word;
    }

    .nl-body h1, .nl-body h2 { font-size: 1.15em; font-weight: 600; color: #1a1a1a; margin: 2em 0 0.7em; line-height: 1.3; }
    .nl-body h3 { font-size: 1em; font-weight: 600; color: #333; margin: 1.8em 0 0.6em; }
    .nl-body h4 { font-size: 0.95em; font-weight: 600; color: #555; margin: 1.5em 0 0.5em; }
    .nl-body p { margin-bottom: 1.4em; }
    .nl-body a { color: #1a1a1a; text-decoration: underline; text-underline-offset: 2px; }
    .nl-body a:hover { color: #555; }
    .nl-body ul, .nl-body ol { padding-left: 1.6em; margin-bottom: 1.4em; }
    .nl-body li { margin-bottom: 0.4em; }
    .nl-body code {
      font-family: 'SF Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
      font-size: 1em; background: #f6f8fa;
      padding: 1px 4px; border-radius: 3px; color: #24292f;
    }
    .nl-body pre { background: #f6f8fa; border: 1px solid #d0d7de; padding: 12px 14px; overflow-x: auto; border-radius: 6px; margin-bottom: 1.2em; }
    .nl-body pre code { background: none; padding: 0; font-size: 0.7em; color: #24292f; }
    .nl-body .highlight { margin-bottom: 1.2em; border: 1px solid #d0d7de; border-radius: 6px; overflow: hidden; }
    .nl-body .highlight pre { margin: 0; border: none; border-radius: 0; padding: 12px 14px; }
    .nl-body blockquote { border-left: 3px solid #ddd; padding: 4px 0 4px 18px; color: #666; margin: 1.4em 0; font-style: italic; }
    .nl-body blockquote p { margin: 0; }
    .nl-body hr { border: none; border-top: 1px solid #ebebeb; margin: 2em 0; }
    .nl-body strong { color: #1a1a1a; }

    .nl-footer {
      margin-top: 60px; padding-top: 20px;
      border-top: 1px solid #ebebeb;
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px;
    }

    .back-link-footer { font-size: 0.82em; color: #aaa; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: color 0.15s; }
    .back-link-footer:hover { color: #1a1a1a; text-decoration: none; }

    @media (max-width: 720px) {
      .shell { flex-direction: column; }
      .main { margin-left: 0; }
      .nl-wrap { width: auto; padding: 32px 24px 60px; }
      .nl-title { font-size: 1.3em; }
    }
  </style>
</head>
<body>
<div id="read-progress"></div>
<div class="shell">

  {% include sidebar.html %}

  <main class="main">
    <div class="nl-wrap">
      <a href="javascript:history.length>1?history.back():window.location='/'" class="back-link">← Newsletter</a>

      <div class="nl-label">Weekly Newsletter</div>
      <h1 class="nl-title">{{ page.title }}</h1>
      <div class="nl-meta">
        <span>{{ page.date | date: "%A, %B %d, %Y" }}</span>
        <span>·</span>
        <a href="{{ site.url }}/newsletter.xml" class="nl-rss" rel="noopener" target="_blank">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><circle cx="3.429" cy="20.571" r="3.429"/><path d="M11.429 24h4.57C15.999 15.179 8.821 8.001 0 8.001v4.572c6.302 0 11.429 5.126 11.429 11.427z"/><path d="M24 24C24 10.766 13.234 0 0 0v4.571c10.714 0 19.429 8.714 19.429 19.429z"/></svg>
          Subscribe via RSS
        </a>
      </div>

      <div class="nl-divider"></div>

      <div class="nl-body">
        {{ content }}
      </div>

      <div class="nl-footer">
        <a href="javascript:history.length>1?history.back():window.location='/'" class="back-link-footer">← All issues</a>
      </div>
    </div>
  </main>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var bar = document.getElementById('read-progress');
  window.addEventListener('scroll', function() {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? Math.min(100, window.scrollY / h * 100) : 0) + '%';
  }, { passive: true });
});
</script>
</body>
</html>
