<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.site_name }}</title>
    <link rel="stylesheet" href="/static/bootstrap-3.1.1.min.css" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Code+Pro:wght@400;600&display=swap" type="text/css">
    <link rel="stylesheet" href="/static/app.css" type="text/css">
    <link rel="stylesheet" href="/static/syntax.css" type="text/css">
    <link rel="stylesheet" href="/static/dark-mode.css" type="text/css">
    <link type="application/atom+xml" rel="alternate" href="{{ site.url }}/atom.xml" />
    <meta name="theme-color" content="#121212">
    <style type="text/css">
      :root {
        --background-color: #121212;
        --text-color: #e0e0e0;
        --sidebar-bg: #1a1a1a;
        --code-bg: #2a2a2a;
        --blockquote-color: #aaa;
        --blockquote-border: #444;
        --link-color: #90caf9;
        --link-color-hover: #bbdefb;
      }

      body {
        background-color: var(--background-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        display: flex;
        min-height: 100vh;
      }

      .right-column {
        width: 100%;
        flex: 1;
        padding: 40px;
        background-color: #121212;
        max-width: 960px;
        margin: 0 auto;
      }
      
      /* Ensure all main content has consistent width across the site */
      .content {
        max-width: 800px;
        margin: 0 auto;
      }

      .profile-section {
        color: var(--text-color);
      }

      .profile-section h1 {
        font-family: 'Source Code Pro', monospace;
        font-weight: 700;
        font-size: 1.4em;
        margin-bottom: 10px;
        text-align: center;
      }

      .profile-section .header-label {
        font-family: 'Source Code Pro', monospace;
        font-size: 0.9em;
        opacity: 0.9;
        margin-bottom: 30px;
        text-align: center;
      }

      .nav-links {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .nav-links li {
        margin-bottom: 7px;
      }

      .nav-links a {
        color: var(--text-color);
        text-decoration: none;
        font-family: 'Source Code Pro', monospace;
        font-size: 1.1em;
        display: flex;
        align-items: center;
      }

      .nav-links a span {
        font-size: 0.9em;
        opacity: 0.8;
        margin-right: 4px;
      }

      @media (max-width: 768px) {
        .right-column {
          padding: 20px;
        }
        
        .content {
          padding: 0;
          max-width: 100%;
        }
      }

      .profile-name {
        font-size: 1.5em;
        margin-bottom: 8px;
      }
      
      .minimal-nav {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
      }
      
      .nav-link {
        color: var(--link-color);
        text-decoration: none;
        font-size: 0.9em;
      }
      
      .nav-link:hover {
        text-decoration: underline;
      }
    </style>
    {% if page.external %}<meta name="robots" content="noindex nofollow">{% endif %}
    <meta name="og:type" content="article">
    <meta name="og:title" content="{{ page.title }} – {{ site.site_name }}">
    <meta name="og:description" content="{{ page.lead }}">
    <meta name="og:site_name" content="{{ site.site_name }}">
    <meta name="og:url" content="{{ site.url }}{{ page.url }}">
    {% if page.image %}
    <meta name="og:image" content="{{ site.url }}{{ page.image }}">
    {% endif %}
    <meta property="article:published_time" content="{{ page.date | date: "%Y-%m-%d" }}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/3.2.0/anchor.min.js"></script>
  </head>
  <body>
    <div class="right-column">
      <div class="minimal-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="{{ site.site_github }}" class="nav-link">GitHub</a>
        <a href="{{ site.site_mastodon }}" class="nav-link">Mastodon</a>
        <a href="{{ site.site_twitter }}" class="nav-link">X</a>
        <a href="{{ site.site_nostr }}" class="nav-link">Nostr</a>
      </div>
      {{ content }}
    </div>

    <script>
      (function () {
        anchors.options.placement = 'right';
        anchors.add('.content > h3, .content > h4, .content > h5, .content > h6');
      })();
    </script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const themeToggle = document.getElementById('themeToggle');
        
        // Set dark theme as default
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      });
    </script>
  </body>
</html>
