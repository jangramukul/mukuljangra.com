<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.site_name }}</title>
    <link rel="stylesheet" href="/static/bootstrap-3.1.1.min.css" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Code+Pro:wght@400;600&display=swap" type="text/css">
    <link rel="stylesheet" href="/static/app.css" type="text/css">
    <link rel="stylesheet" href="/static/syntax.css" type="text/css">
    <link rel="stylesheet" href="/static/dark-mode.css" type="text/css">
    <link rel="stylesheet" href="/static/layout.css" type="text/css">
    <link type="application/atom+xml" rel="alternate" href="{{ site.url }}/atom.xml" />
    <meta name="theme-color" content="#121212">
    <style type="text/css">
      :root {
        --background-color: #121212;
        --text-color: #e0e0e0;
        --sidebar-bg: #1a1a1a;
        --code-bg: #2a2a2a;
        --blockquote-color: #aaa;
        --blockquote-border: #444;
        --link-color: #90caf9;
        --link-color-hover: #bbdefb;
      }

      body {
        background-color: var(--background-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      .top-header {
        text-align: center;
        padding: 40px 20px 20px;
        background-color: var(--background-color);
        border-bottom: 1px solid #333;
      }

      .main-content {
        width: 70%;
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        background-color: var(--background-color);
      }

      .site-title {
        font-family: 'Source Code Pro', monospace;
        font-weight: 700;
        font-size: 1.8em;
        margin-bottom: 10px;
      }

      .site-description {
        font-family: 'Source Code Pro', monospace;
        font-size: 1em;
        opacity: 0.9;
        margin-bottom: 20px;
      }

      .nav-links {
        list-style: none;
        padding: 0;
        margin: 0 0 20px 0;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
      }

      .nav-links li {
        margin: 0 8px;
        display: inline-block;
      }

      .nav-links li:not(:last-child):after {
        content: "/";
        margin-left: 16px;
        color: #666;
      }

      .nav-links a {
        color: var(--text-color);
        text-decoration: none;
        font-family: 'Source Code Pro', monospace;
        font-size: 1em;
      }

      @media (max-width: 768px) {
        .main-content {
          width: 90%;
        }
      }
        body {
          flex-direction: column;
        }
        .left-column {
          width: 100%;
          height: auto;
          position: relative;
        }
        .right-column {
          margin-left: 0;
        }
      }

      .profile-name {
        font-size: 1.5em;
        margin-bottom: 8px;
      }
    </style>
    {% if page.external %}<meta name="robots" content="noindex nofollow">{% endif %}
    <meta name="og:type" content="article">
    <meta name="og:title" content="{{ page.title }} – {{ site.site_name }}">
    <meta name="og:description" content="{{ page.lead }}">
    <meta name="og:site_name" content="{{ site.site_name }}">
    <meta name="og:url" content="{{ site.url }}{{ page.url }}">
    {% if page.image %}
    <meta name="og:image" content="{{ site.url }}{{ page.image }}">
    {% endif %}
    <meta property="article:published_time" content="{{ page.date | date: "%Y-%m-%d" }}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/3.2.0/anchor.min.js"></script>
  </head>
  <body>
    <div class="top-header">
      <h1 class="site-title">{{ site.site_name }}</h1>
      <div class="site-description">{{ site.site_tagline }}</div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="{{ site.site_github }}">GitHub</a></li>
        <li><a href="{{ site.site_mastodon }}">Mastodon</a></li>
        <li><a href="{{ site.site_twitter }}">X</a></li>
        <li><a href="{{ site.site_nostr }}">Nostr</a></li>
      </ul>
      {% include search.html %}
    </div>

    <div class="main-content">
      {{ content }}
    </div>

    <script>
      (function () {
        anchors.options.placement = 'right';
        anchors.add('.content > h3, .content > h4, .content > h5, .content > h6');
      })();
    </script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const themeToggle = document.getElementById('themeToggle');
        
        // Set dark theme as default
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      });
    </script>
  </body>
</html>
