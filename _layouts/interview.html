<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.site_name }}</title>
    <!-- Emoji favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐝</text></svg>">
    <link rel="stylesheet" href="/static/bootstrap-3.1.1.min.css" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" type="text/css">
    <link rel="stylesheet" href="/static/app.css" type="text/css">
    <link rel="stylesheet" href="/static/syntax.css" type="text/css">
    <link rel="stylesheet" href="/static/dark-mode.css" type="text/css">
    <link type="application/atom+xml" rel="alternate" href="{{ site.url }}/atom.xml" />
    <meta name="theme-color" content="#111827">
    <link rel="stylesheet" href="/static/gradient-bg.css" type="text/css">
    <link rel="stylesheet" href="/static/footer.css" type="text/css">
    <style type="text/css">
      :root {
        --background-color: #111827;
        --text-color: #e5e7eb;
        --sidebar-bg: #1e293b;
        --code-bg: #1e293b;
        --blockquote-color: #9ca3af;
        --blockquote-border: rgba(96, 165, 250, 0.4);
        --link-color: #60a5fa;
        --link-color-hover: #93c5fd;
      }

      /* Ensure backgrounds are transparent to show gradient */
      body, .right-column, .content, .content.post {
        background-color: transparent !important;
      }

      body {
        color: var(--text-color);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .right-column {
        width: 100%;
        flex: 1;
        padding: 40px;
        max-width: 1200px;
        margin: 0 auto;
      }
      
      .content {
        max-width: 1000px;
        margin: 0 auto;
      }
      
      .content.post {
        font-size: 16px;
        line-height: 1.7;
        margin: 0 auto;
        color: var(--text-color);
        max-width: 1000px;
        overflow-x: hidden;
        box-sizing: border-box;
        padding: 0;
        width: 100%;
      }

      .back-header {
        font-family: 'Inter', sans-serif;
        font-size: 1.1em;
        margin-bottom: 15px;
        color: var(--text-color);
        font-weight: normal;
        text-decoration: none;
      }

      .back-header:hover {
        color: var(--link-color-hover);
      }

      .back-header a {
        color: var(--text-color);
        text-decoration: underline;
      }

      .back-header a:hover {
        color: var(--link-color-hover);
        text-decoration: underline;
      }

      .content.post h2 {
        font-family: 'Inter', sans-serif;
        font-size: 1.4em;
        margin-top: 1.5em;
        margin-bottom: 0.8em;
        color: #ffffff;
        border-left: 3px solid #60a5fa;
        padding: 4px 0 4px 12px;
        border-bottom: none;
        border-image: none;
        font-weight: 700;
        width: 100%;
        max-width: 100%;
        display: block;
      }

      .content.post h3 {
        font-family: 'Inter', sans-serif;
        font-size: 1.2em;
        margin-top: 1.5em;
        margin-bottom: 0.8em;
        color: #ffffff;
        border-left: 2px solid #a78bfa;
        padding: 2px 0 2px 10px;
        border-bottom: none;
        border-image: none;
        font-weight: 600;
        display: block;
      }

      .content.post h4 {
        font-family: 'Inter', sans-serif;
        font-size: 1.1em;
        margin-top: 1.5em;
        margin-bottom: 0.8em;
        color: #ffffff;
        border-left: 2px solid #c084fc;
        padding: 1px 0 1px 8px;
        border-bottom: none;
        border-image: none;
        font-weight: 600;
        display: block;
      }

      /* Ensure text after headings maintains the same font size */
      .content.post h2 + p,
      .content.post h3 + p,
      .content.post h4 + p,
      .content.post h2 + ul,
      .content.post h3 + ul,
      .content.post h4 + ul,
      .content.post h2 + ol,
      .content.post h3 + ol,
      .content.post h4 + ol {
        font-size: 1.08em;
      }

      .content.post p {
        font-size: 1.08em;
        margin-bottom: 1.5em;
        color: #d1d5db;
        max-width: 100%;
        box-sizing: border-box;
        line-height: 1.7;
      }

      .content.post p.date {
        font-size: 0.9em;
        color: #6b7280;
      }

      .content.post ul,
      .content.post ol {
        font-size: 1.01em;
        margin-top: 0.5em;
        margin-bottom: 1.5em;
        padding-left: 2em;
        color: #d1d5db;
        max-width: 100%;
        box-sizing: border-box;
        list-style-position: outside;
      }

      /* Fix lists that come directly after headings */
      .content.post h2 + ul,
      .content.post h2 + ol,
      .content.post h3 + ul,
      .content.post h3 + ol,
      .content.post h4 + ul,
      .content.post h4 + ol {
        padding-left: 2.5em;
        margin-top: 1em;
      }

      .content.post li {
        font-size: 1.01em;
        margin-bottom: 0.5em;
        color: #d1d5db;
        padding-left: 0.25em;
      }

      .content.post li:last-child {
        margin-bottom: 0;
      }

      .content.post code {
        background-color: var(--code-bg);
        color: var(--text-color);
        word-wrap: break-word;
        white-space: pre-wrap;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.9em;
      }

      .content.post pre {
        background-color: var(--code-bg);
        color: var(--text-color);
        max-width: 100%;
        overflow-x: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        width: 100%;
        box-sizing: border-box;
        border-radius: 12px;
        padding: 16px;
        border: 1px solid rgba(55, 65, 81, 0.4);
      }

      .content.post .highlight {
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 1.5em;
      }

      .content.post .highlight pre {
        margin: 0;
        border-radius: 12px;
      }

      .content.post pre code {
        padding: 0;
        border-radius: 0;
        background-color: transparent;
      }

      .content.post blockquote {
        border-left: 3px solid rgba(96, 165, 250, 0.4);
        padding-left: 1em;
        color: var(--blockquote-color);
        border-radius: 0 8px 8px 0;
        background-color: rgba(30, 41, 59, 0.3);
        padding: 12px 16px 12px 16px;
        overflow: hidden;
      }

      .category-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      
      /* Back button styles */
      .back-navigation {
        margin-bottom: 20px;
        width: 100%;
        padding-top: 70px;
        padding-bottom: 70px;
      }
      
      .back-button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: auto;
        height: 36px;
        background-color: rgba(55, 65, 81, 0.3);
        border-radius: 9999px;
        text-decoration: none;
        color: #d1d5db;
        font-size: 14px;
        transition: all 0.2s ease;
        border: 1px solid rgba(75, 85, 99, 0.4);
        line-height: 1;
        padding: 0 16px;
        font-family: 'Inter', sans-serif;
        gap: 6px;
        font-weight: 500;
      }
      
      .back-button:hover {
        background-color: rgba(96, 165, 250, 0.15);
        color: #ffffff;
        border-color: rgba(96, 165, 250, 0.3);
      }
      
      .back-button .nav-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 16px;
      }
      
      .back-button .nav-text {
        font-size: 13px;
        font-weight: 500;
      }
      
      @media (max-width: 600px) {
        .back-navigation {
          padding-top: 40px;
          padding-bottom: 40px;
        }
        
        .back-button {
          height: 32px;
          padding: 0 12px;
          font-size: 12px;
        }
        
        .back-button .nav-arrow {
          font-size: 14px;
        }
        
        .back-button .nav-text {
          font-size: 12px;
        }
      }

      .category-chip {
        padding: 3px 10px;
        background-color: rgba(55, 65, 81, 0.4);
        border-radius: 9999px;
        font-size: 0.75em;
        transition: all 0.2s ease;
        user-select: none;
        color: #9ca3af;
        border: 1px solid transparent;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
      }
      
      .date-tag-container {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
      }
      
      .content.post p.date {
        font-size: 0.9em;
        color: #6b7280;
        margin-bottom: 0;
        margin-right: 12px;
        font-family: 'Inter', sans-serif;
      }
      
      /* Simple post title without any decorations */
      .post-title {
        border: none !important;
        border-bottom: none !important;
        border-image: none !important;
        border-left: none !important;
        background: none !important;
        display: block !important;
        margin-top: 0.5em !important;
        margin-bottom: 0.5em !important;
        padding: 0 !important;
        text-decoration: none !important;
        font-size: 1.8em !important;
        color: #ffffff !important;
        font-family: 'Inter', sans-serif !important;
        font-weight: 700 !important;
      }
      
      /* Override headings styling for post title */
      h2.post-title {
        border: none !important;
        border-bottom: none !important;
        border-image: none !important;
        border-left: none !important;
        background: none !important;
        padding: 0 !important;
        text-decoration: none !important;
        display: block !important;
        color: #ffffff !important;
        position: static !important;
        font-size: 1.8em !important;
      }
      
      h2.post-title::before,
      h2.post-title::after,
      .post-title::before,
      .post-title::after {
        display: none !important;
        content: none !important;
      }
      @media (max-width: 768px) {
        .right-column {
          padding: 20px;
        }
        
        .content {
          padding: 0;
          max-width: 100%;
          width: 100%;
        }
        
        .content.post {
          padding: 0;
          max-width: 100%;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="gradient-bg"></div>
    <!-- Stars overlay (top 50% only) -->
    <div style="position:fixed;top:0;left:0;right:0;height:50vh;z-index:0;pointer-events:none;overflow:hidden;">
      <div class="star-subtle" style="left:8%;top:12%;animation-delay:0.2s;animation-duration:3.5s"></div>
      <div class="star-subtle" style="left:22%;top:20%;animation-delay:1.8s;animation-duration:4.2s"></div>
      <div class="star-subtle" style="left:45%;top:30%;animation-delay:0.5s;animation-duration:3.8s"></div>
      <div class="star-subtle" style="left:68%;top:10%;animation-delay:2.5s;animation-duration:4.5s"></div>
      <div class="star-subtle" style="left:88%;top:40%;animation-delay:1.1s;animation-duration:3.3s"></div>
      <div class="star-subtle" style="left:35%;top:55%;animation-delay:0.8s;animation-duration:3.6s"></div>
      <div class="star-subtle" style="left:58%;top:65%;animation-delay:2s;animation-duration:4.3s"></div>
      <div class="star-subtle" style="left:78%;top:75%;animation-delay:1.5s;animation-duration:3.9s"></div>
      <div class="star-subtle" style="left:12%;top:70%;animation-delay:3.2s;animation-duration:4s"></div>
      <div class="star-subtle" style="left:95%;top:25%;animation-delay:2.8s;animation-duration:4.1s"></div>
    </div>
    <div class="main-background" style="z-index: -2;"></div>

    <div class="right-column">
      <div class="content post" style="background-color: transparent !important;">
        <div class="back-navigation">
          <a href="#" id="back-to-home" class="back-button" onclick="event.preventDefault(); if (history.length > 1) { history.back(); } else { window.location.href = '/'; }">
            <span class="nav-arrow">←</span>
            <span class="nav-text">Back</span>
          </a>
        </div>
        <h2 class="post-title">{{ page.title }}</h2>
        <div class="date-tag-container">
          {% if page.tags %}
          <div class="category-chips">
            {% for tag in page.tags %}
            <span class="category-chip">{{ tag }}</span>
            {% endfor %}
          </div>
          {% endif %}
        </div>

        {{ content }}
        
        {% include post-navigation.html %}
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Set dark theme as default
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');

        // Tag color mapping
        const TAG_COLORS = [
          { bg: 'rgba(255, 215, 0, 0.18)', border: 'rgba(255, 215, 0, 0.5)', color: '#FFD700' },
          { bg: 'rgba(191, 64, 255, 0.18)', border: 'rgba(191, 64, 255, 0.5)', color: '#BF40FF' },
          { bg: 'rgba(0, 150, 255, 0.18)', border: 'rgba(0, 150, 255, 0.5)', color: '#0096FF' },
          { bg: 'rgba(0, 224, 0, 0.18)', border: 'rgba(0, 224, 0, 0.5)', color: '#00E000' },
          { bg: 'rgba(255, 64, 129, 0.18)', border: 'rgba(255, 64, 129, 0.5)', color: '#FF4081' },
          { bg: 'rgba(0, 230, 210, 0.18)', border: 'rgba(0, 230, 210, 0.5)', color: '#00E6D2' },
          { bg: 'rgba(255, 145, 0, 0.18)', border: 'rgba(255, 145, 0, 0.5)', color: '#FF9100' },
          { bg: 'rgba(255, 50, 50, 0.18)', border: 'rgba(255, 50, 50, 0.5)', color: '#FF3232' },
        ];
        function hashTagName(name) {
          var hash = 0;
          for (var i = 0; i < name.length; i++) { hash = ((hash * 7) + name.charCodeAt(i)) | 0; }
          return Math.abs(hash) % TAG_COLORS.length;
        }
        const TAG_COLOR_MAP = {
          'android': 3,
          'kotlin coroutines': 0,
          'gradle': 6,
          'jetpack compose': 2,
        };
        document.querySelectorAll('.category-chip').forEach(function(el) {
          var tag = el.textContent.trim();
          var idx = TAG_COLOR_MAP[tag.toLowerCase()];
          var c = idx !== undefined ? TAG_COLORS[idx] : TAG_COLORS[hashTagName(tag)];
          el.style.backgroundColor = c.bg;
          el.style.borderColor = c.border;
          el.style.color = c.color;
        });
      });
    </script>
    
    {% include footer.html %}
  </body>
</html>
